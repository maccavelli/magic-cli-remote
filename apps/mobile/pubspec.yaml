name: magic_cli_remote
description: Magic CLI Remote — Android companion for the mcremote daemon.
publish_to: "none"
# PLACEHOLDER — overridden at build time and not the shipped version.
# CI passes --build-name/--build-number (ci.yml), and `make apk` resolves them
# from scripts/next-build-version.sh (MADR 0126 F8). Do not "fix" this by hand:
# a literal bumped here would be wrong the moment a release is cut, and the two
# real sources already agree with each other.
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^18.0.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  http: ^1.6.0
  # SHA-256 over the peer certificate DER for fingerprint pinning.
  # dart:io's X509Certificate only exposes sha1, which is not acceptable here.
  crypto: ^3.0.6
  uuid: ^4.6.0
  mobile_scanner: ^7.4.0
  # On-device P-256 keypair + self-signed client certificate for the client
  # identity (ADR 0005). dart:io has no X.509 generation; this mints the cert
  # SecurityContext then presents for TLS client auth.
  basic_utils: ^5.8.2
  # ES256 (JWS) signing/verification for signed receipts (MADR 0077 D7):
  # ECDSASigner exposes raw r/s BigInt values directly, matching how
  # client_identity.dart already manipulates EC points via this same
  # transitive dependency of basic_utils — declared directly since new code
  # imports it, not just basic_utils.
  pointycastle: ^4.0.0
  package_info_plus: ^10.2.1
  connectivity_plus: ^7.3.1
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.0
  flutter_local_notifications: ^22.3.0
  flutter_foreground_task: ^11.0.1
  speech_to_text: ^7.4.0
  image_picker: ^1.2.3
  # Bounded audio-file composition for OpenCode models that advertise audio
  # input (MADR 0112 A2). Images keep using image_picker's system photo UI.
  file_selector: ^1.1.0
  # App-private support directory for transcript snapshots (MADR 0084 D3).
  # They were blobs in SharedPreferences, which loads every value into the
  # Dart heap at first read and is documented as "not for critical data".
  path_provider: ^2.1.5
  # Vendor brand icons are monochrome SVGs bundled as assets (MADR 0082 D5);
  # rendered tinted to the theme's onSurface.
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Also shipped inside flutter_test; declared directly because tests import
  # it for timer-clock control (background maintenance gate).
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  # Tests fake the application-support directory rather than reaching a real
  # platform channel (MADR 0084 D3): transcript entries are files now.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/MC_icon.png
    - assets/vendor_icons/
    # Curated Lucide UI glyphs, bundled as SVG (MADR 0123 D15). ISC; the
    # notice ships alongside them at assets/ui_icons/LICENSE. Bundled rather
    # than pulled as a package so this adds no dependency and ships only the
    # glyphs actually used.
    - assets/ui_icons/
