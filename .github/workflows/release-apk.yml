# Attach Android APK to a GitHub Release when a version tag is pushed.
name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach artifacts to (workflow_dispatch only)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24"

permissions:
  contents: write

jobs:
  apk:
    name: Build & publish APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js (LTS 24)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Assert Node.js major version
        run: |
          node -v
          major="$(node -p "process.versions.node.split('.')[0]")"
          test "$major" = "24" || { echo "expected Node 24, got $(node -v)" >&2; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Gradle memory for GHA
        run: |
          cat >> android/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=true
          EOF

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Name artifact
        id: name
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.sha }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          OUT="magic-cli-remote-${TAG}-arm64.apk"
          cp -f build/app/outputs/flutter-apk/app-release.apk "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: magic-cli-remote-android-arm64
          path: apps/mobile/${{ steps.name.outputs.apk }}

      # Use gh CLI (no Node-based release action) so we stay on Node 24 only where we control it.
      - name: Attach to GitHub Release
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.name.outputs.tag }}"
          APK="${{ steps.name.outputs.apk }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" "$APK" --clobber
