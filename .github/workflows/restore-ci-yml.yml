name: Restore ci.yml

on:
  push:
    branches: [ci/0143-phase2-ledger]
    paths:
      - '.github/workflows/restore-ci-yml.yml'
  workflow_dispatch:

concurrency:
  group: restore-ci-yml
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  restore:
    name: Copy ci.yml.restored over corrupted ci.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/0143-phase2-ledger

      - name: Restore and push
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          test -f ci.yml.restored || { echo 'error: ci.yml.restored missing' >&2; exit 1; }
          head -c 20 ci.yml.restored | grep -q '^name: CI' || {
            echo 'error: ci.yml.restored does not start with name: CI' >&2
            exit 1
          }
          sz=$(wc -c < ci.yml.restored)
          test "$sz" -gt 10000 || { echo "error: ci.yml.restored too small ($sz)" >&2; exit 1; }
          cp ci.yml.restored .github/workflows/ci.yml
          rm -f ci.yml.restored
          rm -f .github/workflows/restore-ci-yml.yml
          git add .github/workflows/ci.yml
          git add -u ci.yml.restored .github/workflows/restore-ci-yml.yml
          git status
          git commit -m 'ci(0143): capture flake rows from go-native Test retries'
          git push origin HEAD:ci/0143-phase2-ledger
          echo "Restored ci.yml ($sz bytes) and removed one-shot restore workflow."
