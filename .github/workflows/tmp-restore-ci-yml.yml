name: tmp-restore-ci-yml
# One-shot: inflate zlib chunks to ci.yml.restored (repo root).
# GITHUB_TOKEN cannot update .github/workflows/* (needs workflow scope);
# the agent copies ci.yml.restored into place via MCP afterward.
on:
  push:
    branches: [ci/0143-phase2-ledger]
    paths:
      - ".github/workflows/tmp-restore-ci-yml.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-restore-ci-yml
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned from master ci.yml
        with:
          ref: ci/0143-phase2-ledger
          fetch-depth: 0

      - name: Inflate to ci.yml.restored
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          parts_dir = Path(".github/workflows/_ci_restore_parts")
          chunks = sorted(parts_dir.glob("ci.yml.zlib.b64.*"))
          assert chunks, "no zlib b64 chunks found"
          b64 = "".join(p.read_text().strip() for p in chunks)
          b64 = b64.replace("eegoyYGnZw", "eegozYGnZw", 1)
          raw = zlib.decompress(base64.b64decode(b64))
          want = "69f1df02b2123275abd7335771e84174e4f0c631eeda0ea0e6485f27371dbbac"
          got = hashlib.sha256(raw).hexdigest()
          print("got", got)
          assert got == want, (got, want)
          text = raw.decode()
          assert "ci-flake-capture.sh" in text
          assert "Emit flake ledger row" in text
          Path("ci.yml.restored").write_bytes(raw)
          print("wrote ci.yml.restored", len(raw), "bytes")
          PY
          rm -rf .github/workflows/_ci_restore_parts
          rm -f .github/workflows/tmp-restore-ci-yml.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ci.yml.restored .github/workflows/_ci_restore_parts .github/workflows/tmp-restore-ci-yml.yml
          git status
          git commit -m "chore(0143): materialize ci.yml.restored for MCP copy into workflows"
          git push origin HEAD:ci/0143-phase2-ledger
