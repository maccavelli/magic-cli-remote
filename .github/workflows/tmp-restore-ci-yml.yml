name: tmp-restore-ci-yml
# One-shot: reassemble ci.yml from chunked MCP uploads, then self-delete.
on:
  push:
    branches: [ci/0143-phase2-ledger]
    paths:
      - ".github/workflows/tmp-restore-ci-yml.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-restore-ci-yml
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned from master ci.yml
        with:
          ref: ci/0143-phase2-ledger
          fetch-depth: 0

      - name: Reassemble ci.yml from parts
        run: |
          set -euo pipefail
          if [ ! -d .github/workflows/_ci_restore_parts ]; then
            echo "No parts dir; nothing to restore (already done or not staged)."
            exit 0
          fi
          cat .github/workflows/_ci_restore_parts/*.txt > /tmp/ci.yml.restored
          got=$(sha256sum /tmp/ci.yml.restored | awk '{print $1}')
          want=69f1df02b2123275abd7335771e84174e4f0c631eeda0ea0e6485f27371dbbac
          echo "got=$got"
          test "$got" = "$want"
          grep -q 'ci-flake-capture.sh' /tmp/ci.yml.restored
          grep -q 'Emit flake ledger row' /tmp/ci.yml.restored
          mv /tmp/ci.yml.restored .github/workflows/ci.yml
          rm -rf .github/workflows/_ci_restore_parts
          rm -f .github/workflows/tmp-restore-ci-yml.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/ci.yml .github/workflows/_ci_restore_parts .github/workflows/tmp-restore-ci-yml.yml || true
          git status
          git commit -m "$(cat <<'EOF'
ci(0143): capture flake rows from go-native Test retries

Phase 2: tee attempt logs for on_retry_command extraction, emit a 7-field
TSV row when total_attempts != 1, upload as ci-flake-* artifact for the
batch ledger workflow. contents:read unchanged on this workflow.

EOF
)"
          git push origin HEAD:ci/0143-phase2-ledger
