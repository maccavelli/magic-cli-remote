name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Prefer Node.js 24 LTS (Krypton) for JavaScript-based Actions where supported.
# Do not use Node 20 — it is past LTS for this project.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Go daemon: unit tests + binary
  # ---------------------------------------------------------------------------
  go:
    name: Go (test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js (LTS 24)
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Assert Node.js major version
        run: |
          node -v
          major="$(node -p "process.versions.node.split('.')[0]")"
          test "$major" = "24" || { echo "expected Node 24, got $(node -v)" >&2; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Race (core packages)
        run: go test -race ./internal/auth ./internal/config ./internal/session ./internal/ws ./internal/protocol ./internal/provider/grok

      - name: Build mcremote
        run: |
          go build -ldflags "-X main.version=${{ github.sha }} -X main.commit=${{ github.sha }} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/mcremote ./cmd/mcremote
          ./bin/mcremote version

      - name: Upload mcremote binary
        uses: actions/upload-artifact@v5
        with:
          name: mcremote-linux-amd64
          path: bin/mcremote
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Flutter: unit tests
  # ---------------------------------------------------------------------------
  flutter-test:
    name: Flutter (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js (LTS 24)
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Assert Node.js major version
        run: |
          node -v
          major="$(node -p "process.versions.node.split('.')[0]")"
          test "$major" = "24" || { echo "expected Node 24, got $(node -v)" >&2; exit 1; }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Test
        run: flutter test

  # ---------------------------------------------------------------------------
  # Android APK on GitHub-hosted Ubuntu
  # ---------------------------------------------------------------------------
  android-apk:
    name: Android APK (release arm64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js (LTS 24)
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Assert Node.js major version
        run: |
          node -v
          major="$(node -p "process.versions.node.split('.')[0]")"
          test "$major" = "24" || { echo "expected Node 24, got $(node -v)" >&2; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # GitHub runners have more RAM than small self-hosted boxes.
      - name: Gradle memory for GHA
        run: |
          cat >> android/gradle.properties <<'EOF'

          # Override for GitHub-hosted runners (see also local low-RAM defaults above)
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=true
          EOF

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp -f build/app/outputs/flutter-apk/app-release.apk \
            dist/magic-cli-remote-${{ github.sha }}-arm64.apk
          cp -f build/app/outputs/flutter-apk/app-release.apk \
            dist/magic-cli-remote-latest-arm64.apk
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: magic-cli-remote-android-arm64
          path: |
            apps/mobile/dist/*.apk
          if-no-files-found: error
          retention-days: 30
