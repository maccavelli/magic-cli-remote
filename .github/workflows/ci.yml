name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Prefer Node.js 24 LTS (Krypton) for JavaScript-based Actions where supported.
# Do not use Node 20 — it is past LTS for this project.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Go daemon: unit tests + binary
  # ---------------------------------------------------------------------------
  go:
    name: Go (test)
    runs-on: ubuntu-latest
    # Push build/<BASE>.<N> tags so CI and local share one monotonic version ledger.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history + tags for release base (vX.Y.Z) and build/* ledger.
          fetch-depth: 0
          # Needed so GITHUB_TOKEN can push build/* tags on the PR head / branch.
          persist-credentials: true

      - name: Set up Node.js (LTS 24)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Assert Node.js major version
        run: |
          node -v
          major="$(node -p "process.versions.node.split('.')[0]")"
          test "$major" = "24" || { echo "expected Node 24, got $(node -v)" >&2; exit 1; }

      - name: Set up Go
        # v6 runs natively on node24 (v5 still declares node20)
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch build version tags
        run: |
          git fetch origin 'refs/tags/build/*:refs/tags/build/*' --force 2>/dev/null \
            || git fetch origin --tags --force 2>/dev/null \
            || true
          echo "Release tags:"; git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -5 || true
          echo "Recent build tags:"; git tag -l 'build/*' | sort -V | tail -10 || true

      - name: Test
        run: go test ./...

      - name: Race (core packages)
        run: go test -race ./internal/auth ./internal/config ./internal/session ./internal/ws ./internal/protocol ./internal/provider/grok

      - name: Build mcremote
        id: build
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          # Claim build/<BASE>.<N> on origin (scripts/next-build-version.sh).
          MCREMOTE_VERSION_PUSH: "1"
          CI: "true"
        run: |
          make build
          ./bin/mcremote version
          ver="$(./bin/mcremote version | awk '{print $2}')"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          {
            echo "### mcremote version"
            echo "Stamped: \`$ver\`"
            echo "Ledger: git tags \`build/<BASE>.<N>\` (global, race-safe)"
            echo "Counter cache:"
            cat .build-counter 2>/dev/null || echo "(none)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mcremote binary
        uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: mcremote-linux-amd64-${{ steps.build.outputs.version || github.sha }}
          path: bin/mcremote
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Flutter: unit tests
  # ---------------------------------------------------------------------------
  flutter-test:
    name: Flutter (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js (LTS 24)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Assert Node.js major version
        run: |
          node -v
          major="$(node -p "process.versions.node.split('.')[0]")"
          test "$major" = "24" || { echo "expected Node 24, got $(node -v)" >&2; exit 1; }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Test
        run: flutter test

  # ---------------------------------------------------------------------------
  # Android APK on GitHub-hosted Ubuntu
  # ---------------------------------------------------------------------------
  android-apk:
    name: Android APK (release arm64)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js (LTS 24)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Assert Node.js major version
        run: |
          node -v
          major="$(node -p "process.versions.node.split('.')[0]")"
          test "$major" = "24" || { echo "expected Node 24, got $(node -v)" >&2; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # GitHub runners have more RAM than small self-hosted boxes.
      - name: Gradle memory for GHA
        run: |
          cat >> android/gradle.properties <<'EOF'

          # Override for GitHub-hosted runners (see also local low-RAM defaults above)
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=true
          EOF

      - name: Build release APK (arm64)
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            flutter build apk --release --target-platform android-arm64 --build-name="$VERSION" --build-number="${{ github.run_number }}"
          else
            flutter build apk --release --target-platform android-arm64
          fi

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp -f build/app/outputs/flutter-apk/app-release.apk \
            dist/magic-cli-remote-${{ github.sha }}-arm64.apk
          cp -f build/app/outputs/flutter-apk/app-release.apk \
            dist/magic-cli-remote-latest-arm64.apk
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: magic-cli-remote-android-arm64
          path: |
            apps/mobile/dist/*.apk
          if-no-files-found: error
          retention-days: 30
