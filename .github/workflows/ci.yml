name: CI

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# One run per ref; a new push to the same PR/branch cancels the older run.
# Tag runs are NEVER cancelled: the release job creates a GitHub Release and
# then uploads assets, so a cancel landing between those two steps leaves a
# published release with missing or partial artifacts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Prefer Node.js 24 LTS (Krypton) for JavaScript-based Actions where supported.
# Do not use Node 20 — it is past LTS for this project.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24"
  # Pinned so a Flutter stable bump cannot change analyzer results or APK
  # output without a repo change. Bump deliberately; keep in step with the
  # version developers run locally.
  FLUTTER_VERSION: "3.44.6"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Go daemon: vet + race tests + release binaries (tag runs)
  # ---------------------------------------------------------------------------
  go:
    name: Go (test; build on tag)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Write is used only on tag runs, to claim build/<BASE>.<N> version tags on
    # origin. PR and branch runs never push (see the build step's env), so the
    # grant is inert there and unavailable at all on fork PRs.
    permissions:
      contents: write
    # Version stamped into both binaries; used by the release job artifact names.
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags for release base (vX.Y.Z) and build/* ledger.
          fetch-depth: 0
          # Needed so GITHUB_TOKEN can push build/* tags on tag runs.
          persist-credentials: true

      - name: Set up Node.js (LTS 24)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Assert Node.js major version
        run: |
          node -v
          major="$(node -p "process.versions.node.split('.')[0]")"
          test "$major" = "24" || { echo "expected Node 24, got $(node -v)" >&2; exit 1; }

      - name: Set up Go
        # v6 runs natively on node24 (v5 still declares node20)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # go vet does not check formatting, so unformatted code used to merge green.
      - name: Gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "error: gofmt drift — run 'make fmt':" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Go mod tidy is clean
        run: |
          set -euo pipefail
          cp go.mod /tmp/go.mod.bak && cp go.sum /tmp/go.sum.bak
          go mod tidy
          if ! diff -q go.mod /tmp/go.mod.bak >/dev/null || ! diff -q go.sum /tmp/go.sum.bak >/dev/null; then
            echo "error: go.mod/go.sum are not tidy — run 'make tidy' and commit" >&2
            diff -u /tmp/go.mod.bak go.mod || true
            diff -u /tmp/go.sum.bak go.sum || true
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Race-detected run over EVERY package. This replaces the previous
      # `go test ./...` + hand-maintained race allowlist: the allowlist silently
      # excluded new concurrent packages (procutil, admin), and one race pass is
      # measurably faster than a plain pass plus a partial race pass because the
      # test binaries are compiled once instead of twice.
      - name: Test (race, all packages)
        run: go test -race ./...

      # Guards the build/<BASE>.<N> allocator that stamps both binaries. It has
      # always passed; it just never ran anywhere.
      - name: Version allocator tests
        run: ./scripts/next-build-version_test.sh

      # Unit files are shipped to users; a typo'd directive should not reach a
      # release. Shares its implementation with `make preflight` so local and CI
      # cannot drift.
      - name: Validate systemd units
        run: make verify-units

      - name: Verify build-tag policy (Linux netgo; Darwin none)
        run: make verify-build-metadata

      - name: Fetch build version tags
        if: github.ref_type == 'tag'
        run: |
          git fetch origin 'refs/tags/build/*:refs/tags/build/*' --force 2>/dev/null \
            || git fetch origin --tags --force 2>/dev/null \
            || true
          echo "Release tags:"; git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -5 || true
          echo "Recent build tags:"; git tag -l 'build/*' | sort -V | tail -10 || true

      # Build mcremote and mcrelay for their release platforms, all stamped with
      # one shared VERSION/commit/date.
      #
      # BASE_VERSION is pinned to the tag being built. Without it the allocator
      # resolves BASE from the highest vX.Y.Z tag in the repo, so re-running an
      # older tag (or pushing tags out of order) stamped binaries with a version
      # they were not built from.
      - name: Build mcremote & mcrelay
        id: build
        if: github.ref_type == 'tag'
        env:
          # Claim/push build/<BASE>.<N> only on tag runs; PR and branch runs
          # build a locally-stamped binary with no git side effects.
          MCREMOTE_VERSION_PUSH: ${{ github.ref_type == 'tag' && '1' || '0' }}
          MCREMOTE_VERSION_TAG: ${{ github.ref_type == 'tag' && '1' || '0' }}
          CI: "true"
        run: |
          set -euo pipefail
          BASE="${GITHUB_REF_NAME#v}"
          if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag '$GITHUB_REF_NAME' is not vX.Y.Z — cannot derive BASE_VERSION" >&2
            exit 1
          fi

          # Release cross-compile targets — the SAME set for both daemons.
          # build_matrix resolves GOOS/GOARCH; Makefile picks tags per GOOS
          # (MADR 0059 D9: Darwin omits netgo/osusergo).
          PLATFORMS=""
          PLATFORMS="$PLATFORMS linux/amd64"
          PLATFORMS="$PLATFORMS darwin/arm64"
          PLATFORMS="$PLATFORMS darwin/amd64"
          # PLATFORMS="$PLATFORMS windows/amd64"

          # Allocate the shared build/<BASE>.<N> serial ONCE. Every per-platform
          # build below passes VERSION=, which short-circuits the allocator, so
          # a release never mixes serials or claims extra tags. (This is the same
          # allocation make build performs, called directly so no throwaway host
          # build happens before the real matrix.)
          ver="$(scripts/next-build-version.sh "$BASE" | tail -1)"
          case "$ver" in
            "$BASE".*) ;;
            *) echo "error: allocated version '$ver' does not derive from tag base '$BASE'" >&2; exit 1 ;;
          esac
          echo "version=$ver" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          build_matrix() { # $1=make target  $2=binary name  $3=space-separated os/arch list
            local mk="$1" name="$2" list="$3" os arch ext
            for p in $list; do
              os="${p%/*}"; arch="${p#*/}"
              ext=""; [ "$os" = "windows" ] && ext=".exe"
              echo "==> $name $os/$arch"
              make "$mk" VERSION="$ver" GOOS="$os" GOARCH="$arch" >/dev/null
              cp -f "bin/${name}${ext}" "dist/${name}-${os}-${arch}${ext}"
            done
          }
          build_matrix build-remote mcremote "$PLATFORMS"
          build_matrix build-relay  mcrelay  "$PLATFORMS"

          # Smoke the host-native build of each binary — the only platform this
          # runner can execute — to prove ldflags stamping still works. Skips a
          # binary that does not target linux/amd64.
          for bin in mcremote mcrelay; do
            f="dist/${bin}-linux-amd64"
            [ -f "$f" ] || continue
            got="$("./$f" version | awk '{print $2}')"
            test "$got" = "$ver" || { echo "error: ${bin}-linux-amd64 reports '$got', expected '$ver'" >&2; exit 1; }
          done

          (cd dist && sha256sum mcremote-* mcrelay-* > SHA256SUMS)
          ls -lh dist/
          # echo unquoted collapses the list's leading/dup spaces before join.
          active="$(echo $PLATFORMS | tr ' ' ',')"
          {
            echo "### Go binaries"
            echo "Stamped: \`$ver\` (base \`$BASE\` from tag \`$GITHUB_REF_NAME\`)"
            echo "Platforms (mcremote + mcrelay): \`${active}\`"
            echo "Ledger: git tags \`build/<BASE>.<N>\` (global, race-safe)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Go binaries
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcremote-mcrelay-${{ steps.build.outputs.version || github.sha }}
          path: dist/
          if-no-files-found: error

  # Native macOS CI (macos-15 race + LaunchAgent smoke) is intentionally off.
  # Darwin is validated locally on a Mac; Linux CI still cross-compiles Darwin
  # artifacts on tag and runs `make verify-build-metadata` for build-tag policy.
  # Re-enable a go-macos job when ready to pay for hosted runners again.

  # ---------------------------------------------------------------------------
  # Flutter app: format + static analysis + widget/unit tests
  # ---------------------------------------------------------------------------
  flutter:
    name: Flutter (analyze & test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      # `flutter analyze` ignores formatting, so unformatted Dart used to merge
      # green. Fix locally with `dart format .` in apps/mobile.
      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # ---------------------------------------------------------------------------
  # Android APK on GitHub-hosted Ubuntu (built once; reused by the release job)
  # ---------------------------------------------------------------------------
  android-apk:
    name: Android APK (release arm64)
    # Build the phone app only on a release tag. PRs and branch pushes get the
    # fast test jobs; developers build locally with `make apk`.
    #
    # needs go+flutter: this build costs ~10 min, so do not spend it when the
    # tests it ships alongside are already red. `go` also supplies the version
    # the APK is stamped with, keeping one release from carrying two schemes.
    if: github.ref_type == 'tag'
    needs: [go, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      # GitHub runners have more RAM than small self-hosted boxes.
      - name: Gradle memory for GHA
        run: |
          cat >> android/gradle.properties <<'EOF'

          # Override for GitHub-hosted runners (see also local low-RAM defaults above)
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=true
          EOF

      # Release signing (MADR 0065 B1). Separation of concerns for a public
      # repo (docs/ops-android-signing.md):
      #   * all four secrets present  -> sign, in ANY repo (a fork owner can
      #     provision their own keystore and get the same path);
      #   * no secrets, canonical repo -> FAIL. A canonical tag build must
      #     never silently ship a debug-signed APK — it cannot update an
      #     installed app and forces an uninstall that wipes the pairing;
      #   * no secrets, fork/clone    -> build unsigned, with a note. Forks
      #     owe nobody a release key;
      #   * some-but-not-all secrets  -> FAIL everywhere: that is a
      #     misconfiguration, not a fork.
      # Rename caveat: if the canonical repo is ever renamed, update
      # CANONICAL_REPO — with secrets present signing still happens either
      # way, so a rename cannot silently un-sign a release.
      - name: Provision release signing
        id: signing
        env:
          CANONICAL_REPO: maccavelli/magic-cli-remote
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v:-}" ] && present=$((present + 1))
          done
          if [ "$present" -eq 0 ]; then
            if [ "$GITHUB_REPOSITORY" = "$CANONICAL_REPO" ]; then
              echo "error: no Android signing secrets on the canonical repo." >&2
              echo "Canonical release APKs must be signed with the upload" >&2
              echo "keystore; see docs/ops-android-signing.md for setup." >&2
              exit 1
            fi
            echo "note: fork/clone build without signing secrets — the APK"
            echo "will be debug-signed and cannot update an installed app."
            echo "To sign your own builds, see docs/ops-android-signing.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$present" -ne 4 ]; then
            echo "error: $present of 4 Android signing secrets set — partial" >&2
            echo "configuration. Set all of ANDROID_KEYSTORE_BASE64," >&2
            echo "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS," >&2
            echo "ANDROID_KEY_PASSWORD, or none." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          # Java .properties files interpret backslashes — the runbook requires
          # passwords without them, so plain printf is safe here.
          {
            printf 'storeFile=%s\n' "$PWD/android/upload-keystore.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          # Prove the password opens the keystore and the alias exists NOW,
          # before the ~10 min build spends itself on a doomed signing step.
          keytool -list -keystore android/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "keystore provisioned; alias '$KEY_ALIAS' verified"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # MADR 0084 D7. The only step in this pipeline that processes the
      # Android manifest and resources at all — `flutter analyze` and every
      # Dart test are blind to both. It runs before the APK build so a
      # manifest-structural error fails in ~1 minute instead of after a full
      # compile.
      #
      # Scope, measured rather than assumed (2026-08-13): removing
      # `android:exported` from MainActivity fails this step, via the manifest
      # merger that the lint task depends on. `lintVital*` runs only
      # FATAL-severity checks, and two plausible regressions probed here — a
      # wrong `foregroundServiceType`, and a meta-data pointing at a
      # non-existent drawable — passed it. So this is a manifest-structure
      # gate, not a general Android-correctness gate; it would not have caught
      # MADR 0083's L1, which was Dart-side layout.
      #
      # `--config-only` first, and it is load-bearing: android/gradlew is
      # gitignored by the Flutter template, so a fresh checkout has no wrapper
      # and `./gradlew` fails with "No such file or directory" (which is
      # exactly how this step failed on tag v0.10.7). --config-only generates
      # the build files, including the wrapper, without building artifacts.
      - name: Android lint (manifest + resources)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          flutter build apk --config-only --release --target-platform android-arm64
          cd android
          ./gradlew -PmcAndroidLint=true :app:lintVitalRelease --no-daemon

      # Tag/release APKs MUST be Flutter release mode (not debug/profile).
      # FLUTTER_BUILD_MODE is fail-closed: only "release" is accepted.
      #
      # versionName is the full Go build version (e.g. 0.3.11.2) so the APK and
      # the binaries in the same release agree. versionCode stays github.run_number:
      # it must increase monotonically forever, and the build serial N restarts
      # at 1 on every new release base.
      - name: Build release APK (arm64)
        env:
          FLUTTER_BUILD_MODE: release
          BUILD_NAME: ${{ needs.go.outputs.version }}
        run: |
          set -euo pipefail
          MODE="${FLUTTER_BUILD_MODE:?FLUTTER_BUILD_MODE must be set}"
          if [[ "$MODE" != "release" ]]; then
            echo "error: tag APK builds must use Flutter release mode (got FLUTTER_BUILD_MODE=$MODE)" >&2
            exit 1
          fi
          if [[ -n "${BUILD_NAME:-}" ]]; then
            flutter build apk --"$MODE" --target-platform android-arm64 \
              --build-name="$BUILD_NAME" --build-number="${{ github.run_number }}"
          else
            echo "warning: no version from the go job; building unstamped" >&2
            flutter build apk --"$MODE" --target-platform android-arm64
          fi

      - name: Assert Flutter release mode
        env:
          # aapt required here: only reliable way to reject profile (also AOT).
          ASSERT_REQUIRE_AAPT: "1"
          GRADLE_METADATA: build/app/outputs/apk/release/output-metadata.json
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK" || { echo "error: expected $APK after flutter build apk --release" >&2; exit 1; }
          # Working directory is apps/mobile; script lives at repo root.
          ../../scripts/assert-flutter-release-apk.sh "$APK"

      # The other half of fail-closed signing: prove the built APK carries the
      # upload key, not the debug key Gradle silently falls back to when
      # key.properties is malformed. Runs only when signing was provisioned —
      # a fork's deliberately-unsigned build has nothing to assert. Pinning:
      # once the repo variable ANDROID_RELEASE_CERT_SHA256 is set (from this
      # step's log on the first signed release), any future signer change
      # fails the build — which is exactly what a leaked-or-swapped keystore
      # should do.
      - name: Assert release signature (upload key, not debug)
        if: steps.signing.outputs.signed == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          certs="$("$BT/apksigner" verify --print-certs "$APK")"
          printf '%s\n' "$certs"
          if grep -qi 'Android Debug' <<<"$certs"; then
            echo "error: APK is debug-signed — key.properties was not honoured" >&2
            exit 1
          fi
          # apksigner's line format varies by build-tools version ("Signer #1
          # certificate SHA-256 digest:" vs "V2 Signer: certificate SHA-256
          # digest:"), so match on the stable suffix and guard against an
          # empty extraction — an unparseable format must read as "cannot
          # verify", never as a mismatch against the pin.
          got="$(grep -m1 -i 'certificate SHA-256 digest:' <<<"$certs" \
            | sed 's/.*certificate SHA-256 digest:[[:space:]]*//' | tr -d '[:space:]')"
          if [ -z "$got" ]; then
            echo "error: could not extract a SHA-256 signer digest from apksigner output" >&2
            exit 1
          fi
          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
              echo "error: signer digest $got does not match pinned ANDROID_RELEASE_CERT_SHA256" >&2
              exit 1
            fi
            echo "signer digest matches pinned certificate"
          else
            echo "note: ANDROID_RELEASE_CERT_SHA256 repo variable not set — pin it to: $got"
          fi

      - name: Stage artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -f build/app/outputs/flutter-apk/app-release.apk \
            dist/magic-cli-remote-latest-arm64.apk
          ls -lh dist/
          # Re-check staged copy (basename no longer says "release").
          ASSERT_REQUIRE_AAPT=1 ../../scripts/assert-flutter-release-apk.sh \
            dist/magic-cli-remote-latest-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: magic-cli-remote-android-arm64
          path: |
            apps/mobile/dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Publish release assets — tag runs only.
  # No rebuild: downloads APK + Go binary artifacts after go, flutter, and
  # android-apk are all green.
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release assets
    if: github.ref_type == 'tag'
    needs: [go, flutter, android-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # MUST stay before the downloads: checkout defaults to clean: true, which
      # runs `git clean -ffdx` and would delete the untracked apk/ and go-bin/
      # directories the artifacts land in.
      - name: Checkout (assert script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download APK artifact
        # v8 targets Node.js 24; download-artifact@v6 still shipped Node.js 20
        # (unlike upload-artifact@v6), which triggered the deprecation warning.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: magic-cli-remote-android-arm64
          path: apk

      - name: Download Go binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcremote-mcrelay-${{ needs.go.outputs.version || github.sha }}
          path: go-bin

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit repo: avoid relying solely on checkout remote for gh.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VER="${{ needs.go.outputs.version || github.sha }}"

          SRC="apk/magic-cli-remote-latest-arm64.apk"
          if [ ! -f "$SRC" ]; then
            shopt -s nullglob
            candidates=(apk/*.apk)
            shopt -u nullglob
            if [ ${#candidates[@]} -eq 0 ]; then
              echo "error: no APK under apk/ — the android-apk artifact did not land" >&2
              ls -laR apk go-bin 2>&1 || true
              exit 1
            fi
            SRC="${candidates[0]}"
          fi
          APK_OUT="magic-cli-remote-${TAG}-arm64.apk"
          cp -f "$SRC" "$APK_OUT"

          # Content re-check before publish (no Android SDK in this job; aapt
          # gate already ran in android-apk). Rejects debug JIT / wrong basenames.
          ./scripts/assert-flutter-release-apk.sh "$APK_OUT"

          # Artifact zips do not preserve the executable bit.
          chmod +x go-bin/mcremote-* go-bin/mcrelay-*

          # Verify the checksums recorded at build time survived the round trip.
          (cd go-bin && sha256sum -c SHA256SUMS)

          # Smoke the binaries we are about to publish. Only the host platform
          # (linux/amd64) can run here; darwin/windows are content-checked via
          # the checksum verify above. A truncated or mis-stamped linux/amd64
          # build is by far the likeliest corruption and used to ship unchecked.
          # Guarded so this still works if linux/amd64 is ever dropped.
          for bin in mcremote mcrelay; do
            f="go-bin/${bin}-linux-amd64"
            [ -f "$f" ] || continue
            got="$("./$f" version | awk '{print $2}')"
            if [ "$got" != "$VER" ]; then
              echo "error: ${bin}-linux-amd64 reports version '$got', expected '$VER'" >&2
              exit 1
            fi
            echo "ok: ${bin}-linux-amd64 $got"
          done

          # Rename to include the version. Keep any extension LAST so a Windows
          # asset stays mcremote-windows-amd64-<ver>.exe, not ...exe-<ver>.
          ASSETS=("$APK_OUT")
          for f in go-bin/mcremote-* go-bin/mcrelay-*; do
            b="$(basename "$f")"
            case "$b" in
              *.exe) out="${b%.exe}-${VER}.exe" ;;
              *)     out="${b}-${VER}" ;;
            esac
            cp -f "$f" "$out"
            ASSETS+=("$out")
          done

          # Regenerate over the PUBLISHED names. The build-time SHA256SUMS
          # (verified above) lists the pre-rename filenames, so shipping it
          # as-is would hand users a checksum file that matches nothing they
          # can download. Covers the APK too.
          SUMS="SHA256SUMS-${VER}"
          sha256sum "${ASSETS[@]}" > "$SUMS"
          ASSETS+=("$SUMS")

          ls -lh "${ASSETS[@]}"
          cat "$SUMS"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
