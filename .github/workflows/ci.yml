name: CI

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# One run per ref; a new push to the same PR/branch cancels the older run.
# Tag runs are NEVER cancelled: the publish job creates a GitHub Release and
# then uploads assets, so a cancel landing between those two steps leaves a
# published release with missing or partial artifacts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Prefer Node.js 24 LTS (Krypton) for JavaScript-based Actions where supported.
# Do not use Node 20 — it is past LTS for this project.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24"
  # Pinned so a Flutter stable bump cannot change analyzer results or APK
  # output without a repo change. Bump deliberately; keep in step with the
  # version developers run locally.
  FLUTTER_VERSION: "3.47.5"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Go daemon: vet + race tests. The release binaries come from the build job.
  # ---------------------------------------------------------------------------
  go:
    name: Go (test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Read-only. The build/<BASE>.<N> ledger is gone (MADR 0005): a release is
    # an immutable strict tag and this job pushes nothing.
    permissions:
      contents: read
    # MADR 0118 D4. testexec.SkipIfNoSymlink skips where the symlink privilege
    # is absent, which is right on a developer's unprivileged Windows shell and
    # wrong in CI: a lane that stops verifying three symlink-escape invariants
    # must go red, not quietly green. Inert here — Linux always holds the
    # capability — but set explicitly so a sandbox regression surfaces as a
    # failure rather than a SKIP line nobody reads.
    env:
      MC_REQUIRE_SYMLINK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the Makefile derives BASE_VERSION from the
          # vX.Y.Z tags, and the identity test's local `make` builds stamp it.
          fetch-depth: 0
          # This job pushes nothing (MADR 0054 S4), so the token is not kept.
          persist-credentials: false

      - name: Set up Node.js (LTS 24)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Assert Node.js major version
        run: |
          node -v
          major="$(node -p "process.versions.node.split('.')[0]")"
          test "$major" = "24" || { echo "expected Node 24, got $(node -v)" >&2; exit 1; }

      # MADR 0180 / 0170 D3. Numbered records and user-facing markdownlint
      # (D6) on this linux go job only. Windows, Flutter, and ci-windows
      # do not run these. Node 24 is already on PATH for npx.
      - name: Check records
        run: make check-records

      - name: Markdownlint (user-facing docs)
        run: make markdownlint-docs

      - name: Set up Go
        # v6 runs natively on node24 (v5 still declares node20)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # go vet does not check formatting, so unformatted code used to merge green.
      - name: Gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "error: gofmt drift — run 'make fmt':" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Go mod tidy is clean
        run: |
          set -euo pipefail
          cp go.mod /tmp/go.mod.bak && cp go.sum /tmp/go.sum.bak
          go mod tidy
          if ! diff -q go.mod /tmp/go.mod.bak >/dev/null || ! diff -q go.sum /tmp/go.sum.bak >/dev/null; then
            echo "error: go.mod/go.sum are not tidy — run 'make tidy' and commit" >&2
            diff -u /tmp/go.mod.bak go.mod || true
            diff -u /tmp/go.sum.bak go.sum || true
            exit 1
          fi

      # MADR 0174 D4. govulncheck at every level (called, imported, required
      # module), with scripts/vulncheck-allow.txt as the only exceptions; its plain
      # "No vulnerabilities found" covers called code only. Pinned to the host
      # standard's govulncheck rather than @latest: the gate parses its output and
      # refuses output it does not recognise.
      - name: Vulnerability check (govulncheck, every level)
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          gobin="$(go env GOPATH)/bin"
          export PATH="$gobin:$PATH"
          make vulncheck

      - name: Vet
        run: go vet ./...

      # Race-detected run over EVERY package. This replaces the previous
      # `go test ./...` + hand-maintained race allowlist: the allowlist silently
      # excluded new concurrent packages (procutil, admin), and one race pass is
      # measurably faster than a plain pass plus a partial race pass because the
      # test binaries are compiled once instead of twice.
      - name: Test (race, all packages)
        run: go test -race ./...

      # MADR 0116 D20a. The race pass above implies CGO_ENABLED=1, so it links
      # a libc-backed os/user and a net whose resolver selection has a branch
      # the shipped binary does not have. This second pass runs the exact
      # pure-Go stack the linux/amd64 release binary is built with
      # (CGO_ENABLED=0 + netgo,osusergo). Neither pass replaces the other: the
      # first catches data races, the second catches "works under libc, breaks
      # under netgo".
      #
      # Cost: one extra full-suite run on the busiest job, on a free runner.
      - name: Test (cgo-free, all packages)
        run: CGO_ENABLED=0 go test ./...

      # Unit files are shipped to users; a typo'd directive should not reach a
      # release. Shares its implementation with `make preflight` so local and CI
      # cannot drift.
      - name: Validate systemd units
        run: make verify-units

      - name: Verify build-tag policy (Linux netgo; Darwin none)
        run: make verify-build-metadata

      # MADR 0170 D3/D4. `make preflight` has run these three since July, and
      # CI ran none of them, so the Makefile's "a green preflight means a green
      # CI" was false — and 43 staticcheck findings, a `make install` that never
      # restarted the service on a degraded systemd manager, and a test that
      # drove the developer's live unit all stayed invisible. staticcheck's
      # version is pinned by the Makefile (STATICCHECK_VERSION), not the runner.
      - name: Staticcheck (pinned; GOOS linux, darwin, windows)
        run: make staticcheck

      - name: install-binary.sh tests (hermetic, stub service managers)
        run: bash scripts/install-binary_test.sh

  # ---------------------------------------------------------------------------
  # Native execution for the non-amd64-Linux targets (MADR 0116 D17).
  # Cross-compiling proves a target links; only running it proves it works.
  # These runners are free for public repositories.
  # ---------------------------------------------------------------------------
  go-native:
    name: Go (${{ matrix.label }})
    strategy:
      # One platform's failure must not hide another's — the whole point of the
      # matrix is to learn about all of them in one run.
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, label: linux/arm64, shell: bash }
          - { runner: windows-latest, label: windows/amd64, shell: bash }
          # No windows-11-arm leg: windows/arm64 is out of scope (MADR 0116
          # D19) — not a first-class port (zosarch.go), no local acceptance
          # host, and the most divergent runner image (no MSYS2).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # C7 / MADR D20: cgo-free everywhere, builds and tests. This is also what
    # keeps CI on the same pure-Go net and os/user paths the shipped binaries
    # use — with cgo on, os/user goes through libc and net gains a resolver
    # branch production does not have, so a green run would prove something
    # users never execute.
    env:
      CGO_ENABLED: "0"
      # MADR 0118 D4, and the lane it exists for: run 33101607297 proved
      # windows-latest holds SeCreateSymbolicLinkPrivilege (the three symlink
      # tests passed there unguarded), so this asserts that capability instead
      # of hoping for it. If GitHub ever changes runner privileges, the build
      # breaks loudly rather than silently ceasing to test the invariants.
      MC_REQUIRE_SYMLINK: "1"
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go-version-file, not a literal: both images preinstall an older Go
      # (windows-2025 defaults to 1.24.x) and go.mod is the single source of
      # truth for this module's toolchain.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # No -race: off darwin it forces CGO_ENABLED=1
      # (cmd/go/internal/work/init.go), which C7 refuses. Race coverage is the
      # darwin gate in the plan's stability rule plus the ubuntu-latest pass.
      #
      # Retried once (MADR 0143). These two legs produced 16 of the 27 CI
      # failures between 2026-08-19 and 2026-09-05, and all but one of those
      # were timing-sensitive tests rather than broken commits. A deterministic
      # failure still fails: it fails the retry too, which is the half of the
      # Phase 1 exit criterion that proves this has not simply disabled the job.
      #
      # retry_on: error, NOT the action's `any` default — `any` also retries
      # timeouts, and a test that hangs is more likely a real deadlock than a
      # flake. Retrying that away is exactly the masking risk MADR 0143 names as
      # its central cost, so a hang stays red.
      #
      # max_attempts: 2 because the decision was "retry once"; the action
      # defaults to 3. `id` is here for Phase 2, which reads
      # steps.test.outputs.total_attempts to know a retry happened without
      # parsing any logs.
      # Tee attempt output so on_retry_command can extract ^--- FAIL: from
      # attempt 1 before attempt 2 overwrites the log (MADR 0143 Phase 2).
      # Artifact + scheduled/batch commit keeps this job from pushing to the
      # ledger itself — see .github/workflows/ci-flake-ledger.yml.
      - name: Test
        id: test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          shell: bash
          timeout_minutes: 12
          max_attempts: 2
          retry_on: error
          command: |
            set -euo pipefail
            mkdir -p "${RUNNER_TEMP}/ci-flake"
            set +e
            go test ./... 2>&1 | tee "${RUNNER_TEMP}/ci-flake/attempt.log"
            rc=${PIPESTATUS[0]}
            set -e
            exit "$rc"
          # A single bare token, deliberately. nick-fields/retry does not run
          # on_retry_command through `shell: bash` on Windows, so an inline
          # multi-line command's backslash continuations arrive as literal
          # arguments — probe run 34044623679 failed exactly that way and the
          # Windows row fell back to the step name. The wrapper reads
          # RUNNER_TEMP and FLAKE_STEP from the environment instead.
          on_retry_command: bash scripts/ci-flake-on-retry.sh

      # total_attempts > 1 is the ledger trigger (supplied free by the action).
      # Row is uploaded as an artifact; ci-flake-ledger.yml appends to the
      # committed ci-flakes.tsv so a retry does not produce a commit per flake.
      - name: Emit flake ledger row
        if: always() && steps.test.outputs.total_attempts != '1'
        env:
          FLAKE_RUN_ID: ${{ github.run_id }}
          FLAKE_JOB_NAME: Go (${{ matrix.label }})
          FLAKE_COMMIT_SHA: ${{ github.sha }}
          FLAKE_EXIT_CODE: ${{ steps.test.outputs.exit_code }}
          FLAKE_FAILING_TEST_FILE: ${{ runner.temp }}/ci-flake/failing-test.txt
          FLAKE_ROW_OUT: ${{ runner.temp }}/ci-flake/row.tsv
          FLAKE_STEP: Test
        run: bash scripts/ci-flake-emit.sh

      - name: Upload flake ledger row
        if: always() && steps.test.outputs.total_attempts != '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # matrix.label contains '/', which artifact names forbid.
          name: ci-flake-${{ github.run_id }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/ci-flake/row.tsv
          if-no-files-found: warn
          retention-days: 30

  # No go-macos job, deliberately (MADR 0120 D11). Cost is NOT the reason:
  # standard macOS runners are free and unlimited for public repositories (cap:
  # 5 concurrent macOS jobs). The reason is that there is almost nothing here
  # for such a job to run. The darwin-gated surface is 67 lines in two files
  # (procutil/owner_darwin.go, procutil/starttoken_darwin.go), there are zero
  # darwin-gated test files, and those 67 lines are already compile-checked on
  # every push by `make verify-build-metadata`. The macOS logic that matters —
  # plist rendering, TCC, launchd setup — carries no build tags and already
  # runs on the ubuntu and windows lanes. darwin/arm64 runtime behaviour is
  # covered by owner acceptance testing on real hardware.
  #
  # If you are here to add the job: argue from the gated surface, not from
  # "darwin/arm64 has no CI lane". The latter is true and, on its own, not a
  # reason.

  # ---------------------------------------------------------------------------
  # Flutter app: format + static analysis + widget/unit tests
  # ---------------------------------------------------------------------------
  flutter:
    name: Flutter (analyze & test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      # MADR 0127 D7 gate 1. `flutter pub get` rewrites pubspec.lock in place
      # and does NOT fail when the committed resolution is unsatisfiable under
      # the pinned SDK — it just silently re-resolves. That is how dependabot
      # commit 6c02c8e (2026-08-14) left the lockfile fiction for 2.5 weeks
      # while CI built an unrecorded dependency set. Comparing the tree after
      # the resolve is the only thing that catches it.
      - name: Lockfile is reproducible under the pinned toolchain
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          if ! git diff --exit-code --stat pubspec.lock; then
            echo "::error file=apps/mobile/pubspec.lock::pubspec.lock is not reproducible under Flutter ${FLUTTER_VERSION}. Run 'flutter pub get' locally on that exact version and commit the result (MADR 0127 D7)."
            exit 1
          fi

      # `flutter analyze` ignores formatting, so unformatted Dart used to merge
      # green. Fix locally with `dart format .` in apps/mobile.
      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # ---------------------------------------------------------------------------
  # Flutter tests on Windows (MADR 0124 D6).
  #
  # Tests only. `dart format` and `flutter analyze` answer identically on any
  # host (0124 F7), so repeating them here would add no signal and one more way
  # to go red for reasons that have nothing to do with Windows.
  #
  # This lane exists because a real defect hid behind its absence: the
  # transcript cache split filesystem paths on '/' alone, which mangled every
  # entry id on Windows and silently emptied the LRU index. It failed only on a
  # developer's own machine, was written off as environmental in two records,
  # and CI — Linux-only — could never see it.
  #
  # `shell: bash` is explicit because windows-latest defaults to PowerShell,
  # exactly as go-native already does on this runner.
  # ---------------------------------------------------------------------------
  flutter-windows:
    name: Flutter (test on windows)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the same version and action SHA as the Linux lane, so the two
      # cannot drift in toolchain and disagree for a reason that is not the
      # platform.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Test
        run: flutter test

  # ---------------------------------------------------------------------------
  # Android APK on GitHub-hosted Ubuntu (built once; reused by the release job)
  # ---------------------------------------------------------------------------
  android-apk:
    name: Android APK (release arm64)
    # Build the phone app only on a release tag or a manual dispatch. PRs and
    # branch pushes get the fast test jobs; developers build locally with
    # `make apk`. The APK is one of the release spec's extras, so the build job
    # runs under this same gate (MADR 0054, amendment 2026-10-19 (S4)).
    #
    # needs go+flutter: this build costs ~10 min, so do not spend it when the
    # tests it ships alongside are already red.
    # Runnable on demand as well as on a tag. A tag-only job cannot be
    # exercised BEFORE the release that depends on it, which is exactly how
    # the manifest-surface gate shipped broken and failed its first two tag
    # builds (MADR 0126 D4 gate, added after v0.15.3 and never run since).
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [go, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      # GitHub runners have more RAM than small self-hosted boxes.
      - name: Gradle memory for GHA
        run: |
          cat >> android/gradle.properties <<'EOF'

          # Override for GitHub-hosted runners (see also local low-RAM defaults above)
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=true
          EOF

      # Release signing (MADR 0065 B1). Separation of concerns for a public
      # repo (docs/guides/ops-android-signing.md):
      #   * all four secrets present  -> sign, in ANY repo (a fork owner can
      #     provision their own keystore and get the same path);
      #   * no secrets, canonical repo -> FAIL. A canonical tag build must
      #     never silently ship a debug-signed APK — it cannot update an
      #     installed app and forces an uninstall that wipes the pairing;
      #   * no secrets, fork/clone    -> build unsigned, with a note. Forks
      #     owe nobody a release key;
      #   * some-but-not-all secrets  -> FAIL everywhere: that is a
      #     misconfiguration, not a fork.
      # Rename caveat: if the canonical repo is ever renamed, update
      # CANONICAL_REPO — with secrets present signing still happens either
      # way, so a rename cannot silently un-sign a release.
      - name: Provision release signing
        id: signing
        env:
          CANONICAL_REPO: maccavelli/magic-cli-remote
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v:-}" ] && present=$((present + 1))
          done
          if [ "$present" -eq 0 ]; then
            if [ "$GITHUB_REPOSITORY" = "$CANONICAL_REPO" ]; then
              echo "error: no Android signing secrets on the canonical repo." >&2
              echo "Canonical release APKs must be signed with the upload" >&2
              echo "keystore; see docs/guides/ops-android-signing.md for setup." >&2
              exit 1
            fi
            echo "note: fork/clone build without signing secrets — the APK"
            echo "will be debug-signed and cannot update an installed app."
            echo "To sign your own builds, see docs/guides/ops-android-signing.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$present" -ne 4 ]; then
            echo "error: $present of 4 Android signing secrets set — partial" >&2
            echo "configuration. Set all of ANDROID_KEYSTORE_BASE64," >&2
            echo "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS," >&2
            echo "ANDROID_KEY_PASSWORD, or none." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          # Java .properties files interpret backslashes — the runbook requires
          # passwords without them, so plain printf is safe here.
          {
            printf 'storeFile=%s\n' "$PWD/android/upload-keystore.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          # Prove the password opens the keystore and the alias exists NOW,
          # before the ~10 min build spends itself on a doomed signing step.
          keytool -list -keystore android/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "keystore provisioned; alias '$KEY_ALIAS' verified"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # MADR 0084 D7. The only step in this pipeline that processes the
      # Android manifest and resources at all — `flutter analyze` and every
      # Dart test are blind to both. It runs before the APK build so a
      # manifest-structural error fails in ~1 minute instead of after a full
      # compile.
      #
      # Scope, measured rather than assumed (2026-08-13): removing
      # `android:exported` from MainActivity fails this step, via the manifest
      # merger that the lint task depends on. `lintVital*` runs only
      # FATAL-severity checks, and two plausible regressions probed here — a
      # wrong `foregroundServiceType`, and a meta-data pointing at a
      # non-existent drawable — passed it. So this is a manifest-structure
      # gate, not a general Android-correctness gate; it would not have caught
      # MADR 0083's L1, which was Dart-side layout.
      #
      # `--config-only` first, and it is load-bearing: android/gradlew is
      # gitignored by the Flutter template, so a fresh checkout has no wrapper
      # and `./gradlew` fails with "No such file or directory" (which is
      # exactly how this step failed on tag v0.10.7). --config-only generates
      # the build files, including the wrapper, without building artifacts.
      - name: Android lint (manifest + resources)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          flutter build apk --config-only --release --target-platform android-arm64
          cd android
          ./gradlew -PmcAndroidLint=true :app:lintVitalRelease --no-daemon

      # MADR 0126 D4. The step above is a manifest-STRUCTURE gate; this is a
      # manifest-SURFACE gate. lintVitalRelease passes a plugin-injected
      # permission or exported component without comment, which is how the app
      # shipped WAKE_LOCK, RECEIVE_BOOT_COMPLETED, VIBRATE and an exported
      # RebootReceiver that appear nowhere in this repository (0126 F3).
      # Placed here rather than after the APK build so a surface change fails
      # in ~1 minute, for the same reason the lint step sits where it does —
      # processReleaseManifest has already run as a dependency of lintVital.
      - name: Android manifest surface matches the allowlist
        working-directory: apps/mobile
        run: ../../scripts/assert-android-manifest-surface.sh

      # Tag/release APKs MUST be Flutter release mode (not debug/profile).
      # FLUTTER_BUILD_MODE is fail-closed: only "release" is accepted.
      #
      # versionName is the release tag without its v, so the APK and the
      # binaries in the same release agree. versionCode stays github.run_number:
      # it must increase monotonically forever. A dispatched rehearsal is not a
      # release and builds unstamped.
      - name: Build release APK (arm64)
        env:
          FLUTTER_BUILD_MODE: release
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MODE="${FLUTTER_BUILD_MODE:?FLUTTER_BUILD_MODE must be set}"
          if [[ "$MODE" != "release" ]]; then
            echo "error: tag APK builds must use Flutter release mode (got FLUTTER_BUILD_MODE=$MODE)" >&2
            exit 1
          fi
          if [[ "$REF_TYPE" == "tag" ]]; then
            BUILD_NAME="${REF_NAME#v}"
            if [[ ! "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "error: tag '$REF_NAME' is not vX.Y.Z — cannot derive the APK's versionName" >&2
              exit 1
            fi
            flutter build apk --"$MODE" --target-platform android-arm64 \
              --build-name="$BUILD_NAME" --build-number="${{ github.run_number }}"
          else
            echo "note: not a tag; building unstamped" >&2
            flutter build apk --"$MODE" --target-platform android-arm64
          fi

      - name: Assert Flutter release mode
        env:
          # aapt required here: only reliable way to reject profile (also AOT).
          ASSERT_REQUIRE_AAPT: "1"
          GRADLE_METADATA: build/app/outputs/apk/release/output-metadata.json
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK" || { echo "error: expected $APK after flutter build apk --release" >&2; exit 1; }
          # Working directory is apps/mobile; script lives at repo root.
          ../../scripts/assert-flutter-release-apk.sh "$APK"

      # The other half of fail-closed signing: prove the built APK carries the
      # upload key, not the debug key Gradle silently falls back to when
      # key.properties is malformed. Runs only when signing was provisioned —
      # a fork's deliberately-unsigned build has nothing to assert. Pinning:
      # once the repo variable ANDROID_RELEASE_CERT_SHA256 is set (from this
      # step's log on the first signed release), any future signer change
      # fails the build — which is exactly what a leaked-or-swapped keystore
      # should do.
      - name: Assert release signature (upload key, not debug)
        if: steps.signing.outputs.signed == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          certs="$("$BT/apksigner" verify --print-certs "$APK")"
          printf '%s\n' "$certs"
          if grep -qi 'Android Debug' <<<"$certs"; then
            echo "error: APK is debug-signed — key.properties was not honoured" >&2
            exit 1
          fi
          # apksigner's line format varies by build-tools version ("Signer #1
          # certificate SHA-256 digest:" vs "V2 Signer: certificate SHA-256
          # digest:"), so match on the stable suffix and guard against an
          # empty extraction — an unparseable format must read as "cannot
          # verify", never as a mismatch against the pin.
          got="$(grep -m1 -i 'certificate SHA-256 digest:' <<<"$certs" \
            | sed 's/.*certificate SHA-256 digest:[[:space:]]*//' | tr -d '[:space:]')"
          if [ -z "$got" ]; then
            echo "error: could not extract a SHA-256 signer digest from apksigner output" >&2
            exit 1
          fi
          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
              echo "error: signer digest $got does not match pinned ANDROID_RELEASE_CERT_SHA256" >&2
              exit 1
            fi
            echo "signer digest matches pinned certificate"
          else
            echo "note: ANDROID_RELEASE_CERT_SHA256 repo variable not set — pin it to: $got"
          fi

      # The release spec's path-less extra, magic-cli-remote-{tag}-arm64.apk,
      # named as the build workflow's plan names {tag}: the tag on a tag,
      # otherwise rehearsal-<the commit's first 12 hex digits>
      # (go-selfupdate-lib v1.15.2, internal/cmd/selfupdate-release/plan.go).
      # Its stage step refuses an extras artifact holding any other file, so a
      # drift between the two rules fails the build job loudly.
      - name: Stage artifact
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            tag="rehearsal-${SHA:0:12}"
          fi
          out="dist/magic-cli-remote-${tag}-arm64.apk"
          mkdir -p dist
          cp -f build/app/outputs/flutter-apk/app-release.apk "$out"
          ls -lh dist/
          # Re-check staged copy (basename no longer says "release").
          ASSERT_REQUIRE_AAPT=1 ../../scripts/assert-flutter-release-apk.sh "$out"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: magic-cli-remote-android-arm64
          path: |
            apps/mobile/dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Build, check and stage the release through go-selfupdate-lib's reusable
  # workflow (MADR 0054 D1, S4), from the embedded release spec. It builds both
  # products for every platform with one recipe (CGO_ENABLED=0, -trimpath,
  # buildinfo stamps), checks each binary from its own build information, runs
  # each product's identity command on its own platform's runner, writes
  # SHA256SUMS over the canonical names, generates install.sh and install.ps1
  # from the spec's installer block (MADR 0054 PLAN S7b), and stages the APK
  # from android-apk's artifact.
  #
  # On a tag it stages the release. On a dispatch it rehearses, stamped
  # rehearsal-<sha12> (local), and publish skips. It runs where the APK runs,
  # because the APK is one of the extras (MADR 0054, amendment 2026-10-19
  # (S4)): dispatch a rehearsal on the commit before tagging it.
  # ---------------------------------------------------------------------------
  build:
    name: Build self-update release
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [go, go-native, flutter, android-apk]
    permissions:
      contents: read
    uses: maccavelli/go-selfupdate-lib/.github/workflows/build-selfupdate-release.yml@436a7f5976a6815491c7384527fef90869574a1b # go-selfupdate-lib v1.15.2
    with:
      spec-path: internal/updateclient/selfupdate-release.json
      extras-artifact-name: magic-cli-remote-android-arm64

  # ---------------------------------------------------------------------------
  # Publish through go-selfupdate-lib's reusable workflow (MADR 0054 D14). It
  # takes the build job's staged set and its inputs from the build job's
  # outputs, never from a copy written here. It validates the staged file set
  # against the canonical contract, assembles a draft, attests it, publishes
  # it, and waits for immutability. It never uses --clobber and refuses to
  # touch a tag that already has a release. A rehearsal is never published.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish self-update release
    if: github.ref_type == 'tag' && needs.build.outputs.rehearsal == 'false'
    needs: [build]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: maccavelli/go-selfupdate-lib/.github/workflows/publish-selfupdate-release.yml@436a7f5976a6815491c7384527fef90869574a1b # go-selfupdate-lib v1.15.2
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      products-json: ${{ needs.build.outputs.products-json }}
      platforms-json: ${{ needs.build.outputs.platforms-json }}
      extra-assets-json: ${{ needs.build.outputs.extra-assets-json }}
      prerelease-channels-json: ${{ needs.build.outputs.prerelease-channels-json }}
