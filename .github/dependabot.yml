version: 2

# Actions in ci.yml are pinned to commit SHAs (supply-chain: a mutable tag like
# @v6 can be repointed at new code without any change here). Dependabot keeps
# those pins current and rewrites the trailing "# v6" comment, which is the only
# practical way to run SHA pins without them rotting.
#
# Cadence is MONTHLY, not weekly: every PR Dependabot opens triggers a CI run,
# and Actions minutes are the constraint here. Monthly keeps the update stream
# to one small batch a month instead of weekly churn.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # One PR for all action bumps → one CI run per month instead of one per
    # action. "patterns: *" groups every update (majors included); action
    # majors get reviewed by hand before merge regardless.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pub
    directory: "/apps/mobile"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(mobile)"
    groups:
      dart-minor-patch:
        update-types: ["minor", "patch"]
    # 11.0.0 is not a release we will take (0066 D1 stays on 10.3.1 until
    # something newer than 11.0.0). Do not ignore the 11 major: 11.0.1+ /
    # 11.1.0 should still open a PR.
    ignore:
      - dependency-name: "flutter_secure_storage"
        versions: ["11.0.0"]
