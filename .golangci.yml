# golangci-lint v2.15.0 (pinned by scripts/lint.py), adopted by
# docs/decisions/0131-MADR-replace-golint-with-golangci-lint.md and phased by its PLAN.
#
# This is the fleet's configuration (go-llmprovider-sdk's .golangci.yml) with two
# differences, both recorded in that PLAN:
#
#   1. PHASING. A linter is enabled in the phase that fixes its findings and not
#      before, so every phase ends with `make lint` at 0 and CI green. Each disabled
#      linter below names the phase that enables it; P9 removes this table and the
#      file then equals the fleet's apart from difference 2. Nothing is suppressed
#      to get a phase green: no baseline, no path exclusion beyond the fleet's own.
#   2. errcheck.check-blank is false (the owner's ruling of 2026-11-18, Q3 A). This
#      repository's guide (docs/guides/standards/go/logging.md) allows an explicit
#      `_ =` discard of a best-effort cleanup or write when the reason is evident,
#      which the fleet's check-blank: true reports (about 493 sites). The bare
#      calls that drop an error silently are fixed in P5.
version: "2"
run:
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gocritic
    - govet
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nolintlint
    # revive: every fleet rule but confusing-naming (P8) is on; see settings.revive.rules.
    - revive
    - staticcheck # the pinned staticcheck stays beside it (MADR 0131, Q2 A), with its ignore bound
    - unconvert
    - unused
    - whitespace
  disable:
    - bodyclose # P8
    - errorlint # P6
    - gocognit # P8
    - gocyclo # P8
    - gosec # P7
    - nilerr # P6
    - unparam # P8
  settings:
    errcheck:
      check-type-assertions: true
      # Local difference from the fleet (true): see the header. 0131-PLAN, Q3 A.
      check-blank: false
    gocognit:
      min-complexity: 50
    gocritic:
      disabled-checks:
        - paramTypeCombine
        - unnamedResult
        - exitAfterDefer
        - octalLiteral
        - hugeParam
        - rangeValCopy
        - ifElseChain
        - elseif
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 40
    gosec:
      excludes:
        - G104
    # Every //nolint names its linter and is still needed (0021-MADR Z5).
    nolintlint:
      require-specific: true
      allow-unused: false
    revive:
      rules:
        # golint's own checks (P1), then the rest of the fleet's rules (P2).
        # revive reports only the rules listed here; confusing-naming is the one not yet on.
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: atomic
        - name: blank-imports
        # - name: confusing-naming        # P8
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
  exclusions:
    generated: lax
    rules:
      # mkwinsyscall's //sys directives must start "//sys<tab>"; gocritic's
      # commentFormatting allowlist (//go:generate, //export, //line) lacks
      # them. Directive lines only; a prose comment is still checked
      # (0010-MADR, amendment of 2026-10-03).
      - linters:
          - gocritic
        path: _windows\.go$
        source: ^//sys\s
      - linters:
          - errcheck
          - gosec
          - unparam
          - revive
          - gocritic
          - goconst
        path: _test\.go
      - linters:
          - godot
        text: Comment should end in a period
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports # the fleet's formatter (Q4 A); P2 fixed the three files it flagged
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
