# Example mcremote configuration (copy to $XDG_CONFIG_HOME/mcremote/config.yaml)

listen:
  host: "127.0.0.1"
  port: 7531

tls:
  # mode: letsencrypt | selfsigned | off
  #   letsencrypt - publicly trusted cert via ACME DNS-01 (Route 53). The
  #                 phone validates it with the platform trust store; nothing
  #                 is pinned. This is the default as soon as a domain and an
  #                 ACME email are set below.
  #   selfsigned  - long-lived cert minted into data_dir on first run; the
  #                 phone pins its SHA-256 fingerprint from the pair QR.
  #                 The fallback whenever letsencrypt is not configured, and
  #                 what the daemon downgrades to if issuance fails.
  #   off         - plaintext HTTP/WS. Only behind another TLS terminator.
  # Leave empty to auto-select. `enabled: false` is the old spelling of `off`.
  mode: ""
  enabled: true

  letsencrypt:
    # DNS names to request. The first is advertised to phones by `mcremote
    # pair`. Must be real DNS names — Let's Encrypt never issues for an IP,
    # so a 100.64.0.0/10 mesh address cannot be used here.
    domains: []
    #   - devbox.ts.lallygag.net
    email: ""                # ACME account contact (required)
    # Point at the staging CA while testing; certs are untrusted but the rate
    # limits are ~100x higher. Or set staging: true for the same endpoint.
    directory_url: ""
    staging: false
    cache_dir: ""            # default: <data_dir>/acme
    # DNS-01 solver. Credentials come from the ambient AWS chain
    # (AWS_ACCESS_KEY_ID/…, AWS_PROFILE, or an instance role).
    route53:
      hosted_zone_id: ""     # empty => discovered from the zone name
      region: ""             # empty => AWS_REGION
      profile: ""            # empty => AWS_PROFILE

  # Operator-managed certificate instead of the generated one (both or
  # neither). selfsigned mode only.
  cert_file: ""
  key_file: ""

log:
  level: info
  format: text

data_dir: ""

auth:
  require_device_token: true
  require_client_key: true   # ADR 0005 / D7 — default on

providers:
  fake:
    enabled: false         # opt-in for smoke/tests only
  grok:
    enabled: true
    bin: "grok"
    # args: []             # default: agent --no-leader stdio
    always_approve: false  # false => permission_request remoted to clients
    default_cwd: ""        # empty => process cwd / session.create cwd
    model: ""              # optional -m MODEL
    # fs_roots: []         # confine the agent's fs read/write callbacks to these
                           # roots (+ the session cwd); empty => unrestricted.
                           # Audit-only: the agent has terminal access regardless.

limits:
  max_ws_clients: 8        # simultaneous WebSocket connections
  max_live_sessions: 16    # concurrent provider sessions

headscale:
  control_url: "http://localhost:8080"
