# Example mcremote configuration (copy to $XDG_CONFIG_HOME/mcremote/config.yaml)
#
# Every effective setting is spelled out — no invisible defaults. If you add
# a key to the daemon config (internal/config), add it here with its default
# and a comment. See docs/config.md for the full reference.

listen:
  host: "127.0.0.1"        # or "tailscale" (mesh IPv4 only) / "0.0.0.0" (explicit opt-in)
  port: 7531

tls:
  # mode: letsencrypt | selfsigned | off
  #   letsencrypt - publicly trusted cert via ACME DNS-01 (Route 53). The
  #                 phone validates it with the platform trust store; nothing
  #                 is pinned. This is the default as soon as a domain and an
  #                 ACME email are set below.
  #   selfsigned  - long-lived cert minted into data_dir on first run; the
  #                 phone pins its SHA-256 fingerprint from the pair QR.
  #                 The fallback whenever letsencrypt is not configured, and
  #                 what the daemon downgrades to if issuance fails.
  #   off         - plaintext HTTP/WS. Only behind another TLS terminator.
  # Leave empty to auto-select. `enabled: false` is the old spelling of `off`.
  mode: ""
  enabled: true

  letsencrypt:
    # DNS names to request. The first is advertised to phones by `mcremote
    # pair`. Must be real DNS names — Let's Encrypt never issues for an IP,
    # so a 100.64.0.0/10 mesh address cannot be used here.
    domains: []
    #   - devbox.ts.lallygag.net
    email: ""                # ACME account contact (required)
    # Point at the staging CA while testing; certs are untrusted but the rate
    # limits are ~100x higher. Or set staging: true for the same endpoint.
    directory_url: ""
    staging: false
    cache_dir: ""            # default: <data_dir>/acme
    # DNS-01 solver. Credentials come from the ambient AWS chain
    # (AWS_ACCESS_KEY_ID/…, AWS_PROFILE, or an instance role).
    route53:
      hosted_zone_id: ""     # empty => discovered from the zone name
      region: ""             # empty => AWS_REGION
      profile: ""            # empty => AWS_PROFILE
      max_retries: 0         # 0 => AWS SDK default

  # Operator-managed certificate instead of the generated one (both or
  # neither). selfsigned mode only.
  cert_file: ""
  key_file: ""

log:
  level: info                # debug | info | warn | error
  format: text               # text | json

# Empty = XDG data home (~/.local/share/mcremote)
data_dir: ""

auth:
  # Every WS/HTTP request needs a paired device token.
  require_device_token: true
  # Bind tokens to the device's enrolled client key (ADR 0005 / D7).
  # Keyless legacy devices must re-pair while this is on.
  require_client_key: true
  # Browser Origin allowlist for the WS upgrade (e.g. "app.example.com",
  # "*.example.com"). Empty is the secure baseline: native clients (no
  # Origin) and same-origin pages are accepted; cross-origin browser pages
  # rejected. Only needed for a browser client — never "*".
  allowed_origins: []

providers:
  # Dev/smoke echo provider — never enable in normal operation.
  fake:
    enabled: false
  grok:
    enabled: true
    bin: "grok"
    # Empty = built-in default argv (agent --no-leader stdio [+ -m MODEL]).
    args: []
    always_approve: false    # false => permission_request remoted to clients
    default_cwd: ""          # empty => daemon user's home / session.create cwd
    model: ""                # empty = grok's own default
    # How long a remote permission request waits for the phone before the
    # agent gives up (fail-safe cancel). 0 = wait forever.
    permission_timeout_seconds: 120
    # Keep one spare initialized agent process ready (Phase 4.2).
    prewarm: true
    # Notice when a running turn produces no output for this long. 0 = off.
    turn_stall_notice_seconds: 120
    # Confine the agent's fs read/write callbacks to these roots (+ the
    # session cwd); empty = unrestricted. Defense-in-depth and audit only —
    # not a sandbox (the agent has same-user terminal access regardless).
    fs_roots: []
    # ACP auth method to invoke automatically if the agent reports it needs
    # authentication (advertised at initialize). Empty = none (grok needs none).
    auth_method_id: ""
    # MCP servers advertised to the agent (extra tools/context). Each is
    # forwarded only if the agent advertises the matching transport
    # (mcpCapabilities.http / .sse). Empty = none. Example:
    #   mcp_servers:
    #     - name: docs
    #       transport: http          # http | sse
    #       url: https://mcp.example.com/sse
    #       headers:
    #         Authorization: "Bearer <token>"
    mcp_servers: []
  # Goose (block.github.io/goose). Driven through one shared `goose serve`
  # engine (ACP over WebSocket). Pick it per session from the phone's provider
  # menu. No per-session process: the engine handles all sessions, so `args`
  # and `fs_roots` are not applicable (they belong to the old stdio per-session
  # model).
  goose:
    enabled: true
    bin: "goose"
    always_approve: false
    default_cwd: ""          # empty => daemon user's home / session.create cwd
    model: ""                # empty = goose's own default (its config provider
                             # default, typically the most recent selection)
    permission_timeout_seconds: 120
    # No prewarm: goose starts its serve engine on first use only.
    prewarm: false
    turn_stall_notice_seconds: 120
    # Coalesce streamed assistant/thought text into one event per window
    # instead of one per model token (MADR 0024). 0 disables.
    stream_coalesce_ms: 80
    # ACP auth method to invoke if the agent reports it needs authentication.
    # goose advertises goose-provider but session/new works without it.
    auth_method_id: ""
    mcp_servers: []
  # OpenCode (opencode.ai). Pick it per session from the phone's provider menu.
  # Every session multiplexes over one shared long-lived `opencode serve`
  # engine (HTTP + SSE), so there is no per-session process to configure —
  # `transport`, `args` and `fs_roots` were retired in MADR 0019.
  opencode:
    enabled: true
    bin: "opencode"
    always_approve: false
    default_cwd: ""          # empty = the daemon user's home directory
    # Empty uses OpenCode's config default; pin e.g.
    # opencode/deepseek-v4-flash-free or anthropic/claude-haiku-4-5.
    model: ""
    permission_timeout_seconds: 120
    # Boot the shared engine at daemon start so the first session create is
    # instant. false = boot lazily on first use (~3–5s), saving ~250MB idle.
    prewarm: true
    turn_stall_notice_seconds: 120
    # Hold streamed assistant/thought text this long so it ships as one event
    # instead of one per model token (MADR 0024) — ~12 mid-stream updates/sec.
    # The first chunk of a reply and the tail before any control event are
    # never delayed. 0 = one event per token (pre-0024); max 1000.
    stream_coalesce_ms: 80
    # Multi-agent session-tree demux (MADR 0020 KD11). true = child aliases,
    # tree-idle EndTurn, child fan-in. false = exact pre-0020 behaviour (parent-only).
    # Requires opencode ≥ 1.18.0 when enabled.
    session_tree: true

headscale:
  control_url: "http://localhost:8080"

limits:
  max_ws_clients: 8          # simultaneous WebSocket connections (0 → default 8)
  max_live_sessions: 16      # concurrent provider sessions (0 → default 16)

pair:
  # host:port the pair QR/URI tells the phone to dial. Empty = auto-detect
  # (Tailscale IPv4, else loopback). Set this to pin the advertised address —
  # e.g. a stable MagicDNS name or LAN IP the phone can reach. A bare host
  # inherits listen.port. Ignored in tls.mode: letsencrypt, where the cert's
  # primary domain is advertised instead (only `mcremote pair --host` overrides
  # that). Env: MCREMOTE_PAIR_ADVERTISE_HOST (legacy alias MCREMOTE_PAIR_HOST).
  advertise_host: ""

# Outbound registration to mcrelay (MADR 0015). Empty url = disabled.
# When enabled, mcremote dials out (no inbound ports needed) and registers with
# the relay so phones can reach it off-mesh via host_id. Prefer env secrets.
relay:
  url: ""                    # MCREMOTE_RELAY_URL / --relay-url (e.g. wss://relay.example.com)
  host_id: ""                # MCREMOTE_RELAY_HOST_ID / --relay-host-id (public join id)
  secret: ""                 # MCREMOTE_RELAY_SECRET / --relay-secret (min 16 chars; prefer env)
  insecure_skip_verify: false # MCREMOTE_RELAY_INSECURE_SKIP_VERIFY (dev only; relay TLS only)
