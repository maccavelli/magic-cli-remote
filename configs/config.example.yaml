# Example mcremote configuration (copy to $XDG_CONFIG_HOME/mcremote/config.yaml)
#
# Every effective setting is spelled out — no invisible defaults. If you add
# a key to the daemon config (internal/config), add it here with its default
# and a comment. See docs/config.md for the full reference.

listen:
  host: "127.0.0.1"        # or "tailscale" (mesh IPv4 only) / "0.0.0.0" (explicit opt-in)
  port: 7531

tls:
  # mode: letsencrypt | selfsigned | off
  #   letsencrypt - publicly trusted cert via ACME DNS-01 (Route 53). The
  #                 phone validates the chain via the platform trust store.
  #                 The pair QR still carries fp= + mode=letsencrypt: the pin
  #                 is the self-signed fallback leaf (chain OR pin). Default
  #                 once a domain and an ACME email are set below.
  #   selfsigned  - long-lived cert minted into data_dir on first run; the
  #                 phone pins its SHA-256 fingerprint from the pair QR
  #                 (fp= only). The fallback whenever letsencrypt is not
  #                 configured, and what the daemon downgrades to if issuance
  #                 fails.
  #   off         - plaintext HTTP/WS. Only behind another TLS terminator.
  # Leave empty to auto-select. `enabled: false` is the old spelling of `off`.
  mode: ""
  enabled: true

  letsencrypt:
    # DNS names to request. The first is advertised to phones by `mcremote
    # pair`. Must be real DNS names — Let's Encrypt never issues for an IP,
    # so a 100.64.0.0/10 mesh address cannot be used here.
    domains: []
    #   - devbox.ts.lallygag.net
    email: ""                # ACME account contact (required)
    # Point at the staging CA while testing; certs are untrusted but the rate
    # limits are ~100x higher. Or set staging: true for the same endpoint.
    directory_url: ""
    staging: false
    cache_dir: ""            # default: <data_dir>/acme
    # DNS-01 solver. Credentials come from the ambient AWS chain
    # (AWS_ACCESS_KEY_ID/…, AWS_PROFILE, or an instance role).
    route53:
      hosted_zone_id: ""     # empty => discovered from the zone name
      region: ""             # empty => AWS_REGION
      profile: ""            # empty => AWS_PROFILE
      max_retries: 0         # 0 => AWS SDK default

  # Operator-managed certificate instead of the generated one (both or
  # neither). selfsigned mode only.
  cert_file: ""
  key_file: ""

log:
  level: info                # debug | info | warn | error
  format: text               # text | json

# Empty = XDG data home (~/.local/share/mcremote)
data_dir: ""

# Friendly host name the phone shows at the top of the sessions screen
# instead of the dialled address (e.g. a Tailscale IP). Empty = show the
# address. Reported in auth_ok and pair_ok; a phone picks it up on its
# next connect (or on first pair). Max 128 characters. Env:
# MCREMOTE_DISPLAY_NAME.
display_name: ""

auth:
  # Every WS/HTTP request needs a paired device token.
  require_device_token: true
  # Bind tokens to the device's enrolled client key (ADR 0005 / D7).
  # Keyless legacy devices must re-pair while this is on.
  require_client_key: true
  # Browser Origin allowlist for the WS upgrade (e.g. "app.example.com",
  # "*.example.com"). Empty is the secure baseline: native clients (no
  # Origin) and same-origin pages are accepted; cross-origin browser pages
  # rejected. Only needed for a browser client — never "*".
  allowed_origins: []

providers:
  # Dev/smoke echo provider — never enable in normal operation.
  fake:
    enabled: false
  grok:
    enabled: true
    bin: "grok"
    # Empty = built-in default argv (agent --no-leader stdio [+ -m MODEL]).
    args: []
    always_approve: false    # false => permission_request remoted to clients
    default_cwd: ""          # empty => daemon user's home / session.create cwd
    model: ""                # empty = grok's own default
    reasoning_effort: ""     # low | medium | high | xhigh (model-dependent)
    # Pinned, not inherited (MADR 0050 D3). Empty inherits grok's own
    # config and silently undoes the daemon default.
    permission_mode: "default"  # default | acceptEdits | auto | dontAsk | bypassPermissions | plan
    allowed_tools: []
    disallowed_tools: []
    allow_rules: []
    deny_rules: []
    no_subagents: false
    disable_web_search: false
    # Grok's own OS-level sandbox profile (--sandbox <PROFILE>), MADR 0050.
    # Built-ins: off, workspace, devbox, read-only, strict. Any other value is
    # treated as a custom profile name and resolved by grok from
    # ~/.grok/sandbox.toml or .grok/sandbox.toml (grok errors clearly if it is
    # missing). Empty = omit the flag and inherit grok's own default.
    # Env: MCREMOTE_PROVIDERS_GROK_SANDBOX (grok also honours GROK_SANDBOX).
    sandbox: ""
    # How long a remote permission request waits for the phone before the
    # agent gives up (fail-safe cancel). 0 = wait forever.
    permission_timeout_seconds: 120
    # Off: engine starts on first session. Turn on from the phone
    # (Settings → Providers) or set true here.
    prewarm: false
    # Notice when a running turn produces no output for this long. 0 = off.
    turn_stall_notice_seconds: 120
    # Hold streamed assistant/thought text this long so it ships as one event
    # instead of one per token (MADR 0057 H-1). 0 = one event per token; max 1000.
    stream_coalesce_ms: 80
    # Confine the agent's fs read/write callbacks to these roots (+ the
    # session cwd); empty = unrestricted. Defense-in-depth and audit only —
    # not a sandbox (the agent has same-user terminal access regardless).
    fs_roots: []
    # ACP auth method pin. Empty is correct for grok: MADR 0085 D2
    # auto-selects a headless-safe advertised method. It is not "grok
    # needs none".
    auth_method_id: ""
    # MCP servers advertised to the agent (extra tools/context). Each is
    # forwarded only if the agent advertises the matching transport
    # (mcpCapabilities.http / .sse). Empty = none. Example:
    #   mcp_servers:
    #     - name: docs
    #       transport: http          # http | sse
    #       url: https://mcp.example.com/sse
    #       headers:
    #         Authorization: "Bearer <token>"
    mcp_servers: []
  # Goose (block.github.io/goose). Driven through one shared `goose serve`
  # engine (ACP over WebSocket). Pick it per session from the phone's provider
  # menu. No per-session process: the engine handles all sessions, so `args`
  # and `fs_roots` are not applicable (they belong to the old stdio per-session
  # model).
  goose:
    enabled: true
    bin: "goose"
    always_approve: false
    default_cwd: ""          # empty => daemon user's home / session.create cwd
    model: ""                # empty = goose's own default (its config provider
                             # default, typically the most recent selection)
    permission_timeout_seconds: 120
    # Default false = boot goose serve on first use. true pre-warms at daemon start.
    prewarm: false
    turn_stall_notice_seconds: 120
    # Coalesce streamed assistant/thought text into one event per window
    # instead of one per model token (MADR 0024). 0 disables.
    stream_coalesce_ms: 80
    # ACP auth method to invoke if the agent reports it needs authentication.
    # goose advertises goose-provider but session/new works without it.
    auth_method_id: ""
    # Optional named Goose built-ins to enable on the shared engine. This is
    # intentionally not a general-purpose argument escape hatch.
    with_builtins: []
    mcp_servers: []
  # OpenCode (opencode.ai). Pick it per session from the phone's provider menu.
  # Every session multiplexes over one shared long-lived `opencode serve`
  # engine (HTTP + SSE), so there is no per-session process to configure —
  # `transport`, `args` and `fs_roots` were retired in MADR 0019.
  opencode:
    enabled: true
    bin: "opencode"
    always_approve: false
    default_cwd: ""          # empty = the daemon user's home directory
    # Empty uses OpenCode's config default; pin e.g.
    # opencode/deepseek-v4-flash-free or anthropic/claude-haiku-4-5.
    model: ""
    permission_timeout_seconds: 120
    # Off: engine starts on first session. Turn on from the phone
    # (Settings → Providers) or set true here. true skips the ~3–5s
    # Bun cold start but holds ~250MB idle.
    prewarm: false
    turn_stall_notice_seconds: 120
    # Hold streamed assistant/thought text this long so it ships as one event
    # instead of one per model token (MADR 0024) — ~12 mid-stream updates/sec.
    # The first chunk of a reply and the tail before any control event are
    # never delayed. 0 = one event per token (pre-0024); max 1000.
    stream_coalesce_ms: 80
    # Multi-agent session-tree demux (MADR 0020 KD11). true = child aliases,
    # tree-idle EndTurn, child fan-in. false = exact pre-0020 behaviour (parent-only).
    # Requires opencode ≥ 1.18.0 when enabled.
    session_tree: true
    # Run opencode serve with --pure (skip loading external third-party plugins)
    pure: false
  # Codex (OpenAI Codex CLI). Driven through one shared `codex app-server --listen
  # stdio://` engine (JSON-RPC over stdio). Pick it per session from the phone's
  # provider menu. All sessions multiplex over one engine process.
  codex:
    enabled: true
    bin: "codex"
    always_approve: false
    default_cwd: ""            # empty = daemon user's home / session.create cwd
    # Empty uses Codex's config.toml default; pin e.g. gpt-5.6-terra.
    model: ""
    # How long a remote permission request waits before timing out (fail-safe
    # cancel). 0 = wait forever. Default 900 (MADR 0028).
    permission_timeout_seconds: 900
    # Boot the shared engine at daemon start so the first session create is
    # instant. false = boot lazily on first use (~500ms).
    prewarm: false
    # Notice when a running turn produces no output for this long. 0 = off.
    # Default 120 (same as other providers); 0 left phones looking frozen
    # during multi-minute codex tool runs after a WS blip.
    turn_stall_notice_seconds: 120
    # Coalesce streamed assistant/thought text into one event per window
    # instead of one per model token (MADR 0024). 0 disables.
    stream_coalesce_ms: 80
    # Override the Codex approval policy. Empty = inherit ~/.codex/config.toml.
    # Valid: "untrusted", "on-request", "never".
    approval_policy: ""
    # Override the Codex sandbox mode. Empty = inherit ~/.codex/config.toml.
    # Valid: "read-only", "workspace-write", "danger-full-access".
    sandbox_mode: ""
    # Advertise the "full access" session mode, which runs with no approval
    # prompts AND no sandbox. The "auto" mode (no prompts, but edits confined
    # to the workspace) is always available and is the safer default; this is
    # only for a machine you are content to let an unattended agent modify
    # anywhere (MADR 0044).
    #
    # Note the difference from always_approve above: that one is global to the
    # provider and set here, in a file. A session mode is chosen per session
    # from the phone, is not persisted, and resets when the daemon restarts.
    allow_full_access: false
    # When the Linux userns/bwrap workspace-write probe fails (MADR 0048):
    # warn (default) | require_full_access | refuse.
    sandbox_broken_policy: warn
  # Kilo CLI (kilo.ai, npm @kilocode/cli). An OpenCode fork with its own
  # Gateway, agents, and model aliases — driven through one shared
  # `kilo serve` engine (HTTP + SSE), same architecture as opencode
  # (MADR 0075). Known-good CLI: kilo 7.4.22 (MADR 0088).
  kilo:
    enabled: true
    bin: "kilo"
    always_approve: false
    default_cwd: ""          # empty = the daemon user's home directory
    # Empty uses Kilo's own default, which depends on Gateway auth state
    # (kilo-auto/free logged out, kilo-auto/balanced with a Gateway session).
    # Pin providerID/modelID, split on the FIRST slash — model ids may
    # themselves contain slashes: e.g. kilo/kilo-auto/free,
    # openrouter/openrouter/free, kilo/~anthropic/claude-sonnet-4-5.
    model: ""
    permission_timeout_seconds: 120
    # Off: engine starts on first session. Turn on from the phone
    # (Settings → Providers) or set true here.
    prewarm: false
    turn_stall_notice_seconds: 120
    # Same coalescing as other providers (MADR 0024). 0 disables; max 1000.
    stream_coalesce_ms: 80
    # Session-tree demux stays OFF for kilo until child-event fixtures prove
    # it (MADR 0075 Q7) — the routes exist but are unverified on this fork.
    session_tree: false
    # Run kilo serve with --pure (skip loading external third-party plugins)
    pure: false

headscale:
  control_url: "http://localhost:8080"

limits:
  max_ws_clients: 8          # simultaneous WebSocket connections (0 → default 8)
  max_live_sessions: 16      # concurrent provider sessions (0 → default 16)
  # Rolling authenticated-WS read deadline (seconds). 0 → 120. Floor 15.
  # Advertised to v2 phones (MADR 0068). Covers brief Doze/mesh blips;
  # awake clients still app-ping every 10 s.
  ws_read_deadline_seconds: 120
  # v2 resume-token validity after issue (0 → 120).
  ws_resume_window_seconds: 120
  # Kernel TCP keepalive on accepted connections (MADR 0068). Zero-value
  # fields also resolve to these numbers. disable: true turns probes off.
  # 25+4×5 ≈ 45 s reaps a silent peer inside the 120 s app deadline.
  tcp_keepalive:
    disable: false
    idle_seconds: 25
    interval_seconds: 5
    count: 4

pair:
  # host:port the pair QR/URI tells the phone to dial. Empty = auto-detect
  # (Tailscale IPv4, else loopback). Set this to pin the advertised address —
  # e.g. a stable MagicDNS name or LAN IP the phone can reach. A bare host
  # inherits listen.port. Ignored in tls.mode: letsencrypt, where the cert's
  # primary domain is advertised instead (only `mcremote pair --host` overrides
  # that). Env: MCREMOTE_PAIR_ADVERTISE_HOST (legacy alias MCREMOTE_PAIR_HOST).
  advertise_host: ""

# Outbound registration to mcrelay (MADR 0015). Empty url = disabled.
# When enabled, mcremote dials out (no inbound ports needed) and registers with
# the relay so phones can reach it off-mesh via host_id. Prefer env secrets.
relay:
  url: ""                    # MCREMOTE_RELAY_URL / --relay-url (e.g. wss://relay.example.com)
  host_id: ""                # MCREMOTE_RELAY_HOST_ID / --relay-host-id (public join id)
  secret: ""                 # MCREMOTE_RELAY_SECRET / --relay-secret (min 16 chars; prefer env)
  insecure_skip_verify: false # MCREMOTE_RELAY_INSECURE_SKIP_VERIFY (dev only; relay TLS only)

# Signed receipts for permission decisions (MADR 0077). Off by default —
# opt in per pattern, not globally: only decisions whose "<tool_name>
# <detail>" summary matches allow_patterns (and doesn't match deny_patterns,
# which always wins) get a device-signed, hash-chained receipt appended to
# <data_dir>/receipts/<device_id>.jsonl. Shell-glob syntax (*, ?, [set]);
# see docs/receipts.md.
receipts:
  enabled: false             # MCREMOTE_RECEIPTS_ENABLED
  allow_patterns: []         # MCREMOTE_RECEIPTS_ALLOW_PATTERNS (comma-separated)
    # - "*rm -rf*"
    # - "*push --force*"
    # - "*kubectl delete*"
  deny_patterns: []          # MCREMOTE_RECEIPTS_DENY_PATTERNS (comma-separated); wins over allow_patterns
    # - "*--dry-run*"
  handoffs: true             # MCREMOTE_RECEIPTS_HANDOFFS — sign a receipt for each device-to-device
                             # session handoff (release + claim), MADR 0078. Only consulted when
                             # enabled: true. Set false to keep permission receipts but leave
                             # handoffs unattested. The handoff feature itself is always available.
