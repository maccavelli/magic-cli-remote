# Mesh + agents (phone over Headscale → host :7531)
# Used by scripts/start-mcremote-grok.sh and installed to
# ~/.config/mcremote/config.yaml for the systemd service.
#
# Every effective setting is spelled out — no invisible defaults. If you add
# a key to the daemon config, add it here with its default and a comment.

# host: "tailscale" resolves to this host's Tailscale IPv4 at startup and
# refuses to start if there is none. Use "0.0.0.0" only as a deliberate
# opt-in to serving clients that are not on the tailnet.
listen:
  host: "tailscale"
  port: 7531

tls:
  # mode: letsencrypt | selfsigned | off
  #   letsencrypt - publicly trusted cert via ACME DNS-01 (Route 53). The
  #                 phone validates it with the platform trust store; nothing
  #                 is pinned. This is the default as soon as a domain and an
  #                 ACME email are set below.
  #   selfsigned  - long-lived cert minted into data_dir on first run; the
  #                 phone pins its SHA-256 fingerprint from the pair QR.
  #                 The fallback whenever letsencrypt is not configured, and
  #                 what the daemon downgrades to if issuance fails.
  #   off         - plaintext HTTP/WS. Only behind another TLS terminator.
  # Leave empty to auto-select. `enabled: false` is the old spelling of `off`.
  mode: ""
  enabled: true

  letsencrypt:
    # DNS names to request. The first is advertised to phones by `mcremote
    # pair`. Must be real DNS names — Let's Encrypt never issues for an IP,
    # so a 100.64.0.0/10 mesh address cannot be used here.
    domains: []
    #   - devbox.ts.lallygag.net
    email: ""                # ACME account contact (required)
    # Point at the staging CA while testing; certs are untrusted but the rate
    # limits are ~100x higher. Or set staging: true for the same endpoint.
    directory_url: ""
    staging: false
    cache_dir: ""            # default: <data_dir>/acme
    # DNS-01 solver. Credentials come from the ambient AWS chain
    # (AWS_ACCESS_KEY_ID/…, AWS_PROFILE, or an instance role).
    route53:
      hosted_zone_id: ""     # empty => discovered from the zone name
      region: ""             # empty => AWS_REGION
      profile: ""            # empty => AWS_PROFILE
      max_retries: 0         # 0 => AWS SDK default

  # Operator-managed certificate instead of the generated one (both or
  # neither). selfsigned mode only.
  cert_file: ""
  key_file: ""

log:
  level: info                # debug | info | warn | error
  format: text               # text | json (text is right for journald)

# Empty = XDG data home (~/.local/share/mcremote)
data_dir: ""

auth:
  # Every WS/HTTP request needs a paired device token.
  require_device_token: true
  # Bind tokens to the device's enrolled client key (ADR 0005): a stolen
  # token alone is useless without the device's TLS client certificate.
  # Keyless legacy devices must re-pair while this is on.
  require_client_key: true
  # Browser Origin allowlist for the WS upgrade (e.g. "app.example.com",
  # "*.example.com"). Empty is the secure baseline: native clients (no
  # Origin) and same-origin pages are accepted; cross-origin browser pages
  # rejected. Only needed for a browser client — never "*".
  allowed_origins: []

providers:
  # Dev/smoke echo provider — never enable in normal operation.
  fake:
    enabled: false
  grok:
    enabled: true
    bin: "grok"
    # Empty = the built-in default argv (agent --no-leader stdio [+ -m MODEL]).
    args: []
    # Never auto-approve: permission requests go to the phone for approval.
    always_approve: false
    # Working directory for new sessions when the phone leaves it empty.
    # Empty = the daemon user's home directory. The phone remembers the last
    # path used and offers it as the next default.
    default_cwd: ""
    model: ""                # empty = grok's own default
    reasoning_effort: ""     # low | medium | high
    permission_mode: ""      # default | acceptEdits | auto | dontAsk | bypassPermissions | plan
    allowed_tools: []
    disallowed_tools: []
    allow_rules: []
    deny_rules: []
    no_subagents: false
    disable_web_search: false
    # How long a remote permission request waits for the phone before the
    # agent gives up (fail-safe cancel). 0 = wait forever.
    permission_timeout_seconds: 120
    # Keep one spare initialized agent process ready so session create/resume
    # skips the engine cold start. Costs one idle process's memory.
    prewarm: true
    # Notice when a running turn produces no output for this long. 0 = off.
    turn_stall_notice_seconds: 120
    # Confine the agent's fs read/write callbacks to these roots (+ the
    # session cwd); empty = unrestricted. Defense-in-depth and audit only —
    # not a sandbox (the agent has same-user terminal access regardless).
    fs_roots: []
    auth_method_id: ""
    mcp_servers: []
  # Goose (block.github.io/goose), driven through one shared `goose serve`
  # engine (ACP over WebSocket). Pick it per session from the phone's
  # new-session provider menu. No per-session process (HTTP transport), so
  # `args` and `fs_roots` are not applicable.
  goose:
    enabled: true
    bin: "goose"
    always_approve: false
    default_cwd: ""
    model: ""
    permission_timeout_seconds: 120
    prewarm: false
    turn_stall_notice_seconds: 120
    stream_coalesce_ms: 80
    auth_method_id: ""
    with_builtins: []
    mcp_servers: []
  # OpenCode (opencode.ai), driven through one shared long-lived
  # `opencode serve` engine (HTTP + SSE) that every session multiplexes over.
  # Pick it per session from the phone's new-session provider menu.
  #
  # MADR 0019 retired the per-session ACP transport, so `transport`, `args`
  # and `fs_roots` no longer exist for this provider — do not re-add them.
  opencode:
    enabled: true
    bin: "opencode"
    always_approve: false
    default_cwd: ""          # empty = the daemon user's home directory
    # Pin a model so OpenCode never falls through to its broken zen/… default.
    # deepseek-v4-flash-free: free zero-auth, ~1s short prompts (vs ~3–8s big-pickle).
    # For even faster chat with paid keys: anthropic/claude-haiku-* etc.
    model: "opencode/deepseek-v4-flash-free"
    permission_timeout_seconds: 120
    # Boot the `opencode serve` engine at daemon start so the first
    # session create skips the ~4s Bun cold start. false = boot lazily on
    # first use, saving ~250MB of resident memory while idle.
    prewarm: true
    # Notice when a running turn goes silent for this long. 0 = off.
    turn_stall_notice_seconds: 120
    # Hold streamed assistant/thought text this long so it ships as one event
    # instead of one per model token (MADR 0024) — ~12 mid-stream updates/sec.
    # Matters most over a mesh link. 0 = one event per token; max 1000.
    stream_coalesce_ms: 80
    # Multi-agent session-tree demux (MADR 0020 KD11). true = child aliases,
    # tree-idle EndTurn, child fan-in. false = exact pre-0020 behaviour (parent-only).
    # Requires opencode ≥ 1.18.0 when enabled.
    session_tree: true
    pure: false
  codex:
    enabled: true
    bin: "codex"
    always_approve: false
    default_cwd: ""
    model: ""
    permission_timeout_seconds: 900
    prewarm: false
    turn_stall_notice_seconds: 0
    stream_coalesce_ms: 80
    approval_policy: ""
    sandbox_mode: ""
    # Advertise the unsandboxed "full access" mode (MADR 0044). "auto" — no
    # prompts, edits confined to the workspace — is always available.
    allow_full_access: false

headscale:
  control_url: "https://headscale.lallygag.net"

pair:
  # host:port the pair QR/URI tells the phone to dial. Empty = auto-detect
  # (Tailscale IPv4, else loopback). In letsencrypt mode the primary ACME
  # domain is used instead; only `mcremote pair --host` overrides that.
  # Env: MCREMOTE_PAIR_ADVERTISE_HOST (legacy alias MCREMOTE_PAIR_HOST).
  advertise_host: ""

# Outbound registration to mcrelay (MADR 0015). Empty url = disabled.
relay:
  url: ""                    # MCREMOTE_RELAY_URL / --relay-url
  host_id: ""                # MCREMOTE_RELAY_HOST_ID / --relay-host-id
  secret: ""                 # MCREMOTE_RELAY_SECRET / --relay-secret (min 16; prefer env)
  insecure_skip_verify: false # MCREMOTE_RELAY_INSECURE_SKIP_VERIFY (dev only)

limits:
  # Simultaneous WebSocket clients (phones); further connects are refused.
  max_ws_clients: 8
  # Concurrent live agent sessions across all providers.
  max_live_sessions: 16
