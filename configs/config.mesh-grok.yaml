# Mesh + agents (phone over Headscale → host :7531)
# Used by scripts/start-mcremote-grok.sh and installed to
# ~/.config/mcremote/config.yaml for the systemd service.
#
# Every effective setting is spelled out — no invisible defaults. If you add
# a key to the daemon config, add it here with its default and a comment.

# host: "tailscale" resolves to this host's Tailscale IPv4 at startup and
# refuses to start if there is none. Use "0.0.0.0" only as a deliberate
# opt-in to serving clients that are not on the tailnet.
listen:
  host: "tailscale"
  port: 7531

tls:
  # mode: letsencrypt | selfsigned | off
  #   letsencrypt - publicly trusted cert via ACME DNS-01 (Route 53). The
  #                 phone validates the chain via the platform trust store.
  #                 The pair QR still carries fp= + mode=letsencrypt: the pin
  #                 is the self-signed fallback leaf (chain OR pin). Default
  #                 once a domain and an ACME email are set below.
  #   selfsigned  - long-lived cert minted into data_dir on first run; the
  #                 phone pins its SHA-256 fingerprint from the pair QR
  #                 (fp= only). The fallback whenever letsencrypt is not
  #                 configured, and what the daemon downgrades to if issuance
  #                 fails.
  #   off         - plaintext HTTP/WS. Only behind another TLS terminator.
  # Leave empty to auto-select. `enabled: false` is the old spelling of `off`.
  mode: ""
  enabled: true

  letsencrypt:
    # DNS names to request. The first is advertised to phones by `mcremote
    # pair`. Must be real DNS names — Let's Encrypt never issues for an IP,
    # so a 100.64.0.0/10 mesh address cannot be used here.
    domains: []
    #   - devbox.ts.lallygag.net
    email: ""                # ACME account contact (required)
    # Point at the staging CA while testing; certs are untrusted but the rate
    # limits are ~100x higher. Or set staging: true for the same endpoint.
    directory_url: ""
    staging: false
    cache_dir: ""            # default: <data_dir>/acme
    # DNS-01 solver. Credentials come from the ambient AWS chain
    # (AWS_ACCESS_KEY_ID/…, AWS_PROFILE, or an instance role).
    route53:
      hosted_zone_id: ""     # empty => discovered from the zone name
      region: ""             # empty => AWS_REGION
      profile: ""            # empty => AWS_PROFILE
      max_retries: 0         # 0 => AWS SDK default

  # Operator-managed certificate instead of the generated one (both or
  # neither). selfsigned mode only.
  cert_file: ""
  key_file: ""

log:
  level: info                # debug | info | warn | error
  format: text               # text | json (text is right for journald)

# Empty = XDG data home (~/.local/share/mcremote)
data_dir: ""

# Friendly host name the phone shows at the top of the sessions screen
# instead of the dialled address (e.g. a Tailscale IP). Empty = show the
# address. Reported in auth_ok and pair_ok; a phone picks it up on its
# next connect (or on first pair). Max 128 characters. Env:
# MCREMOTE_DISPLAY_NAME.
display_name: ""

auth:
  # Every WS/HTTP request needs a paired device token.
  require_device_token: true
  # Bind tokens to the device's enrolled client key (ADR 0005): a stolen
  # token alone is useless without the device's TLS client certificate.
  # Keyless legacy devices must re-pair while this is on.
  require_client_key: true
  # Browser Origin allowlist for the WS upgrade (e.g. "app.example.com",
  # "*.example.com"). Empty is the secure baseline: native clients (no
  # Origin) and same-origin pages are accepted; cross-origin browser pages
  # rejected. Only needed for a browser client — never "*".
  allowed_origins: []

providers:
  # Dev/smoke echo provider — never enable in normal operation.
  fake:
    enabled: false  # true registers it; for tests and smoke runs only (MADR 0055 R6)
  # grok (Grok Build), driven over ACP: each session runs `grok agent stdio`.
  # allowed_tools, disallowed_tools, allow_rules and deny_rules are gone: grok
  # ignores them over ACP (measured on 0.2.114 and 1.0.70), and an unknown key
  # here now fails the load (0208 MADR D6).
  grok:
    # Register grok. Harmless when the binary is absent: it lists as not ready.
    enabled: true
    # The grok executable, by name on PATH or by path.
    bin: "grok"
    # Replaces the built-in argv when non-empty. Empty runs grok with the
    # global flags the keys below set, then `--no-auto-update agent
    # --no-leader stdio`. Config-file only: an entry may contain a comma.
    args: []
    # true answers every permission request with its allow option instead of
    # asking the phone. Keep false so the phone approves.
    always_approve: false
    # A session's working directory when the phone names none. Empty = the
    # daemon user's home directory; a relative path is resolved against this
    # file's directory.
    default_cwd: ""
    # The model a session starts on, e.g. grok-4.6. Empty = grok's own default.
    model: ""
    # low | medium | high | xhigh, as the model advertises. Applied through
    # session/new `_meta.reasoningEffort` (MADR 0106). Empty = grok's default.
    reasoning_effort: ""
    # default | acceptEdits | auto | dontAsk | bypassPermissions | plan
    # (--permission-mode). Pinned, not inherited (MADR 0050 D3): empty lets
    # grok's own config decide, which the daemon cannot see. Process-wide:
    # changing it needs an engine restart.
    permission_mode: "default"
    # true disables subagent spawning (--no-subagents).
    no_subagents: false
    # true disables grok's web search and web fetch tools (--disable-web-search).
    disable_web_search: false
    # grok's own OS-level sandbox profile (--sandbox <PROFILE>), MADR 0050.
    # Built-ins: off, workspace, devbox, read-only, strict. Any other value is
    # a custom profile, resolved by grok from ~/.grok/sandbox.toml or
    # .grok/sandbox.toml. Empty = grok's own default. grok also honours
    # GROK_SANDBOX.
    sandbox: ""
    # How long a permission request waits for the phone, in seconds, before
    # grok is told it was cancelled. 0 = wait forever.
    permission_timeout_seconds: 120
    # true keeps one spare initialized grok ready, so a session skips the cold
    # start (MADR 0089 D5). The phone can turn it on and off too.
    prewarm: false
    # A notice on the phone when a running turn produces no output for this
    # many seconds. 0 = off.
    turn_stall_notice_seconds: 120
    # Hold streamed text this many milliseconds so it ships as one event, not
    # one per token (MADR 0057 H-1). 0 = one event per token; max 1000.
    stream_coalesce_ms: 80
    # Confine grok's fs read/write callbacks to these roots (plus the session
    # cwd). Empty = unrestricted. Defense-in-depth and audit only, not a
    # sandbox: the agent has same-user terminal access. Config-file only.
    fs_roots: []
    # Pin of the ACP authenticate method. Empty lets the daemon pick a
    # headless-safe method grok advertises (MADR 0085 D2). Never pin the
    # grok.com method: it opens a browser.
    auth_method_id: ""
    # MCP servers advertised to grok. Each is forwarded only when grok
    # advertises its transport (mcpCapabilities.http / .sse). Config-file
    # only. Example:
    #   mcp_servers:
    #     - name: docs
    #       transport: http          # http | sse
    #       url: https://mcp.example.com/sse
    #       headers:
    #         Authorization: "Bearer <token>"
    mcp_servers: []
  # OpenCode (opencode.ai) v2. Each session runs its own `opencode acp`; one
  # shared control plane serves the rest (0214 MADR). Pick it per session from
  # the phone's new-session provider menu.
  opencode:
    enabled: true
    bin: "opencode"
    # Empty = the built-in argv (acp).
    args: []
    always_approve: false
    default_cwd: ""          # empty = the daemon user's home directory
    # Pin a model so OpenCode never falls through to its broken zen/… default.
    # deepseek-v4.1-flash-free: free zero-auth.
    # For even faster chat with paid keys: anthropic/claude-haiku-* etc.
    model: "opencode/deepseek-v4.1-flash-free"
    permission_timeout_seconds: 120
    # Off: the first session starts `opencode acp`. Turn on from the phone
    # (Settings → Providers) or set true here.
    prewarm: false
    # Notice when a running turn goes silent for this long. 0 = off.
    turn_stall_notice_seconds: 120
    # Confine the agent's fs read/write callbacks to these roots (+ the
    # session cwd); empty = unrestricted. Defense-in-depth and audit only —
    # not a sandbox (the agent has same-user terminal access regardless).
    fs_roots: []
    # ACP auth method pin. Leave it empty: the phone's auth runs on the
    # control plane, and opencode's one ACP method, opencode-login, opens a
    # terminal login.
    auth_method_id: ""
    # MCP servers advertised to each session (extra tools/context). Each is
    # forwarded only if opencode advertises the matching transport
    # (mcpCapabilities.http / .sse). Empty = none. The control plane loads
    # none of opencode's own (0230 MADR). Same shape as grok's mcp_servers.
    mcp_servers: []
    # --- remote shell policy (MADR 0112 A9) --------------------------------
    # OFF by default. allow_remote_shell lets a paired phone run a command in
    # the session's working directory. RISK: OpenCode's shell endpoint
    # bypasses normal model tool-permission checks, so this is remote command
    # execution on THIS host. The phone additionally confirms every command,
    # but that is a second line of defence, not the first.
    allow_remote_shell: false
  codex:
    enabled: true
    bin: "codex"
    always_approve: false
    default_cwd: ""
    model: ""
    permission_timeout_seconds: 900
    prewarm: false
    turn_stall_notice_seconds: 120
    stream_coalesce_ms: 80
    approval_policy: ""
    sandbox_mode: ""
    # Advertise the unsandboxed "full access" mode (MADR 0044). "auto" — no
    # prompts, edits confined to the workspace — is always available.
    allow_full_access: false
    sandbox_broken_policy: warn  # warn | require_full_access | refuse (MADR 0048)
    transport: stdio
    listen_address: ""
    ws_auth_mode: ""  # capability_token | signed_bearer (ws only)
    reconnect_attempts: 3
    # Host-owned remote execution catalog (MADR 0109 D36); ws:// loopback-only.
    environments: []
    # Unsandboxed standalone processes stay off (MADR 0109 D37).
    standalone_processes_enabled: false
    standalone_process_env_allowlist: []
  # Kilo CLI (kilo.ai). Default-on (MADR 0075). Known-good: kilo 7.4.22 (MADR 0088).
  kilo:
    enabled: true
    bin: "kilo"
    always_approve: false
    default_cwd: ""
    model: ""
    permission_timeout_seconds: 120
    # Off: engine starts on first session. Turn on from the phone
    # (Settings → Providers) or set true here.
    prewarm: false
    turn_stall_notice_seconds: 120
    stream_coalesce_ms: 80
    session_tree: false
    pure: false

headscale:
  control_url: "https://headscale.lallygag.net"

pair:
  # host:port the pair QR/URI tells the phone to dial. Empty = auto-detect
  # (Tailscale IPv4, else loopback). In letsencrypt mode the primary ACME
  # domain is used instead; only `mcremote pair --host` overrides that.
  # Env: MCREMOTE_PAIR_ADVERTISE_HOST (legacy alias MCREMOTE_PAIR_HOST).
  advertise_host: ""

# Outbound registration to mcrelay (MADR 0015). Empty url = disabled.
relay:
  url: ""                    # MCREMOTE_RELAY_URL / --relay-url
  host_id: ""                # MCREMOTE_RELAY_HOST_ID / --relay-host-id
  secret: ""                 # MCREMOTE_RELAY_SECRET / --relay-secret (min 16; prefer env)
  insecure_skip_verify: false # MCREMOTE_RELAY_INSECURE_SKIP_VERIFY (dev only)
  # Cap on one relayed WS frame across the tunnel bridge (0115 F6).
  # 0 = 10 MiB, the relay default. Range when set: 4096–16777216.
  max_frame_bytes: 0 # MCREMOTE_RELAY_MAX_FRAME_BYTES

limits:
  # Simultaneous WebSocket clients (phones); further connects are refused.
  max_ws_clients: 8
  # Concurrent live agent sessions across all providers.
  max_live_sessions: 16
  ws_read_deadline_seconds: 120
  ws_resume_window_seconds: 120
  tcp_keepalive:
    disable: false
    idle_seconds: 25
    interval_seconds: 5
    count: 4

# Signed receipts for permission decisions (MADR 0077). Off by default.
# See docs/guides/receipts.md.
receipts:
  enabled: false
  allow_patterns: []
  deny_patterns: []
  handoffs: true             # only consulted when enabled: true (MADR 0078)
