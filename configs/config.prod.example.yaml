# Production-oriented example (mesh + Grok)

listen:
  host: "0.0.0.0"      # only with Headscale grants locking TCP 7531
  port: 7531

log:
  level: info
  format: json

auth:
  require_device_token: true

providers:
  fake:
    enabled: false
  grok:
    enabled: true
    bin: "grok"
    always_approve: false
    # default_cwd: "/home/you/src"

headscale:
  control_url: "http://localhost:8080"
