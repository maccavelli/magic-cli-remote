# Production-oriented example (mesh + Grok + OpenCode)
#
# Every effective setting is spelled out — no invisible defaults. If you add
# a key to the daemon config, add it here with its default and a comment.

# "tailscale" binds this host's Tailscale IPv4 only, resolved at startup;
# the daemon fails closed if no tailnet address exists. Combine with the
# deny-by-default Headscale ACL in docs/headscale.md.
listen:
  host: "tailscale"    # or "0.0.0.0" to deliberately serve off-tailnet clients
  port: 7531

tls:
  # mode: letsencrypt | selfsigned | off
  #   letsencrypt - publicly trusted cert via ACME DNS-01 (Route 53). The
  #                 phone validates the chain via the platform trust store.
  #                 The pair QR still carries fp= + mode=letsencrypt: the pin
  #                 is the self-signed fallback leaf (chain OR pin). Default
  #                 once a domain and an ACME email are set below.
  #   selfsigned  - long-lived cert minted into data_dir on first run; the
  #                 phone pins its SHA-256 fingerprint from the pair QR
  #                 (fp= only). The fallback whenever letsencrypt is not
  #                 configured, and what the daemon downgrades to if issuance
  #                 fails.
  #   off         - plaintext HTTP/WS. Only behind another TLS terminator.
  # Leave empty to auto-select. `enabled: false` is the old spelling of `off`.
  mode: ""
  enabled: true

  letsencrypt:
    # DNS names to request. The first is advertised to phones by `mcremote
    # pair`. Must be real DNS names — Let's Encrypt never issues for an IP,
    # so a 100.64.0.0/10 mesh address cannot be used here.
    domains: []
    #   - devbox.ts.lallygag.net
    email: ""                # ACME account contact (required)
    # Point at the staging CA while testing; certs are untrusted but the rate
    # limits are ~100x higher. Or set staging: true for the same endpoint.
    directory_url: ""
    staging: false
    cache_dir: ""            # default: <data_dir>/acme
    # DNS-01 solver. Credentials come from the ambient AWS chain
    # (AWS_ACCESS_KEY_ID/…, AWS_PROFILE, or an instance role).
    route53:
      hosted_zone_id: ""     # empty => discovered from the zone name
      region: ""             # empty => AWS_REGION
      profile: ""            # empty => AWS_PROFILE
      max_retries: 0         # 0 => AWS SDK default

  # Operator-managed certificate instead of the generated one (both or
  # neither). selfsigned mode only.
  cert_file: ""
  key_file: ""

log:
  level: info
  format: json

# Empty = XDG data home; production often sets an absolute path.
data_dir: ""

# Friendly host name the phone shows at the top of the sessions screen
# instead of the dialled address (e.g. a Tailscale IP). Empty = show the
# address. Reported in auth_ok and pair_ok; a phone picks it up on its
# next connect (or on first pair). Max 128 characters. Env:
# MCREMOTE_DISPLAY_NAME.
display_name: ""

auth:
  require_device_token: true
  # ADR 0005 / D7 — default on; keyless legacy devices must re-pair.
  require_client_key: true
  # Browser Origin allowlist; empty is the secure baseline. Never "*".
  allowed_origins: []

providers:
  fake:
    enabled: false
  grok:
    enabled: true
    bin: "grok"
    args: []                 # empty = agent --no-leader stdio [+ -m MODEL]
    always_approve: false
    # default_cwd: "/home/you/src"
    default_cwd: ""
    model: ""
    reasoning_effort: ""     # low | medium | high | xhigh (model-dependent)
    permission_mode: "default"  # pinned (MADR 0050 D3); empty undoes the daemon default
    allowed_tools: []
    disallowed_tools: []
    allow_rules: []
    deny_rules: []
    no_subagents: false
    disable_web_search: false
    # Grok's own OS-level sandbox profile (--sandbox <PROFILE>), MADR 0050.
    # Built-ins: off, workspace, devbox, read-only, strict. Any other value is
    # treated as a custom profile name and resolved by grok from
    # ~/.grok/sandbox.toml or .grok/sandbox.toml (grok errors clearly if it is
    # missing). Empty = omit the flag and inherit grok's own default.
    # Env: MCREMOTE_PROVIDERS_GROK_SANDBOX (grok also honours GROK_SANDBOX).
    sandbox: ""
    permission_timeout_seconds: 120
    prewarm: false
    turn_stall_notice_seconds: 120
    stream_coalesce_ms: 80   # MADR 0057 H-1 (0 = one event per token)
    fs_roots: []
    auth_method_id: ""
    mcp_servers: []
  goose:
    enabled: true
    bin: "goose"
    always_approve: false
    default_cwd: ""
    model: ""
    permission_timeout_seconds: 120
    # Headless hosts need file-based secrets; see config.example.yaml (0110).
    keyring_disabled: true
    prewarm: false
    turn_stall_notice_seconds: 120
    stream_coalesce_ms: 80
    auth_method_id: ""
    with_builtins: []
    mcp_servers: []
  # Always driven through one shared `opencode serve` engine (HTTP + SSE).
  opencode:
    enabled: true
    bin: "opencode"
    always_approve: false
    default_cwd: ""
    model: ""                # pin e.g. opencode/deepseek-v4-flash-free
    permission_timeout_seconds: 120
    prewarm: false           # first session starts the engine (MADR 0089 D5)
    turn_stall_notice_seconds: 120
    stream_coalesce_ms: 80   # MADR 0024 (0 = one event per token)
    session_tree: true       # MADR 0020 KD11 (requires opencode ≥ 1.18.0)
    pure: false
    # Remote mutation policy (MADR 0112 A8/A9), both off by default.
    # share: uploads the transcript to OpenCode's service, readable by anyone
    #        holding the link.
    # shell: remote command execution on this host; bypasses model tool
    #        permissions. Leave false unless you intend exactly that.
    allow_remote_share: false
    allow_remote_shell: false
  codex:
    enabled: true
    bin: "codex"
    always_approve: false
    default_cwd: ""
    model: ""
    permission_timeout_seconds: 900
    prewarm: false
    turn_stall_notice_seconds: 120
    stream_coalesce_ms: 80
    approval_policy: ""
    sandbox_mode: ""
    # Advertise the unsandboxed "full access" mode (MADR 0044). "auto" — no
    # prompts, edits confined to the workspace — is always available.
    allow_full_access: false
    sandbox_broken_policy: warn  # warn | require_full_access | refuse (MADR 0048)
    transport: stdio
    listen_address: ""
    ws_auth_mode: ""  # capability_token | signed_bearer (ws only)
    reconnect_attempts: 3
    # Host-owned remote execution catalog (MADR 0109 D36). Empty in production
    # until an operator registers one; ws:// is loopback-only, wss:// otherwise.
    environments: []
    # Unsandboxed standalone processes stay off in production (MADR 0109 D37).
    standalone_processes_enabled: false
    standalone_process_env_allowlist: []
  # Kilo CLI (kilo.ai). Default-on (MADR 0075). Known-good: kilo 7.4.22 (MADR 0088).
  kilo:
    enabled: true
    bin: "kilo"
    always_approve: false
    default_cwd: ""
    model: ""
    permission_timeout_seconds: 120
    prewarm: false           # first session starts the engine (MADR 0089 D5)
    turn_stall_notice_seconds: 120
    stream_coalesce_ms: 80
    session_tree: false      # off until child-SSE fixtures prove demux (0075 Q7)
    pure: false

headscale:
  control_url: "http://localhost:8080"

pair:
  # host:port the pair QR/URI tells the phone to dial. Empty = auto-detect
  # (Tailscale IPv4, else loopback). In letsencrypt mode the primary ACME
  # domain is used instead; only `mcremote pair --host` overrides that.
  # Env: MCREMOTE_PAIR_ADVERTISE_HOST (legacy alias MCREMOTE_PAIR_HOST).
  advertise_host: ""

# Outbound registration to mcrelay (MADR 0015). Empty url = disabled.
relay:
  url: ""                    # MCREMOTE_RELAY_URL / --relay-url
  host_id: ""                # MCREMOTE_RELAY_HOST_ID / --relay-host-id
  secret: ""                 # MCREMOTE_RELAY_SECRET / --relay-secret (min 16; prefer env)
  insecure_skip_verify: false # MCREMOTE_RELAY_INSECURE_SKIP_VERIFY (dev only)
  # Cap on one relayed WS frame across the tunnel bridge (0115 F6).
  # 0 = 1 MiB, the relay default. Range when set: 4096–16777216.
  max_frame_bytes: 0 # MCREMOTE_RELAY_MAX_FRAME_BYTES

limits:
  max_ws_clients: 8
  max_live_sessions: 16
  ws_read_deadline_seconds: 120
  ws_resume_window_seconds: 120
  tcp_keepalive:
    disable: false
    idle_seconds: 25
    interval_seconds: 5
    count: 4

# Signed receipts for permission decisions (MADR 0077). Off by default.
# See docs/receipts.md.
receipts:
  enabled: false
  allow_patterns: []
  deny_patterns: []
  handoffs: true             # only consulted when enabled: true (MADR 0078)
