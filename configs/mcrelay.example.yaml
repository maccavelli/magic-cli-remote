# Example mcrelay configuration (MADR 0015).
# Install: cp configs/mcrelay.example.yaml ~/.config/mcrelay/config.yaml
#          chmod 600 ~/.config/mcrelay/config.yaml
#
# Precedence: CLI flags > MCRELAY_* env > this file > defaults.
# Full reference: docs/config-mcrelay.md

listen:
  host: "0.0.0.0"
  port: 8443

tls:
  # empty = letsencrypt when domains+email set; else files when PEMs set; else off
  # mode: letsencrypt | files | off
  mode: letsencrypt
  cert_file: ""
  key_file: ""
  letsencrypt:
    domains:
      - relay.example.com
    email: ops@example.com
    staging: true              # set false for production LE
    directory_url: ""
    cache_dir: ""              # default: <data_dir>/acme
    http_port: 0               # 0 = 80 (public LE requires 80)
  # Operator PEMs instead of ACME:
  # mode: files
  # cert_file: "/etc/ssl/mcrelay/fullchain.pem"
  # key_file: "/etc/ssl/mcrelay/privkey.pem"

log:
  level: info
  format: text

# Empty → $XDG_DATA_HOME/mcrelay or ~/.local/share/mcrelay
data_dir: ""

# Registration allowlist. Prefer secrets via MCRELAY_HOSTS or unit --env
# rather than committing them to a tracked file.
hosts:
  - id: devbox-1
    secret: "replace-with-long-registration-secret"

# Tunnel claims use short-lived dial tokens (R12). Only enable if an old
# mcremote still sends the registration secret on /v1/tunnel (MADR 0017 D13).
allow_legacy_tunnel_secret: false

limits:
  max_hosts: 32
  max_phones_per_host: 8
  max_message_bytes: 1048576
  max_concurrent_join: 64
  accept_per_minute: 120      # pre-auth WS upgrades per IP
  join_per_minute: 30         # join attempts per IP (R16)
  register_per_minute: 20     # register attempts per IP (R16)
  join_per_host_per_minute: 60 # joins for one host_id (H3 / R10)
  tunnel_wait_seconds: 15
  register_idle_seconds: 30   # host control app-level ping (R5)
  splice_idle_seconds: 300    # end splice after silence (R15); -1 disables
  splice_max_seconds: 43200   # max splice lifetime 12h (R15); -1 disables
  # Ceilings (load rejects higher): max_hosts 1024, max_phones 256,
  # max_message_bytes 16MiB, max_concurrent_join 4096, rates 100000/min, durations 7d.
