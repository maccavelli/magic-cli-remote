# mcremote default configuration (written by setup-service when missing).
# Location: $XDG_CONFIG_HOME/mcremote/config.yaml or ~/.config/mcremote/config.yaml
# Values match config.Defaults(). See docs/guides/config.md.

listen:
  host: "127.0.0.1"        # use "tailscale" for mesh-only remote access
  port: 7531

tls:
  # empty = letsencrypt when domains+email set, else selfsigned
  mode: ""
  enabled: true
  cert_file: ""
  key_file: ""
  letsencrypt:
    domains: []
    email: ""
    directory_url: ""
    staging: false
    cache_dir: ""
    route53:
      hosted_zone_id: ""
      region: ""
      profile: ""
      max_retries: 0

log:
  level: info
  format: text

# Empty = XDG data home (~/.local/share/mcremote)
data_dir: ""

# Friendly host name shown on the phone's sessions screen (MADR 0102).
# Empty = the dialled address. Env: MCREMOTE_DISPLAY_NAME.
display_name: ""

auth:
  require_device_token: true
  require_client_key: true
  allowed_origins: []

providers:
  # Dev/smoke echo provider — never enable in normal operation.
  fake:
    enabled: false  # true registers it; for tests and smoke runs only (MADR 0055 R6)
  # grok (Grok Build), driven over ACP: each session runs `grok agent stdio`.
  # allowed_tools, disallowed_tools, allow_rules and deny_rules are gone: grok
  # ignores them over ACP (measured on 0.2.114 and 1.0.70), and an unknown key
  # here now fails the load (0208 MADR D6).
  grok:
    # Register grok. Harmless when the binary is absent: it lists as not ready.
    enabled: true
    # The grok executable, by name on PATH or by path.
    bin: "grok"
    # Replaces the built-in argv when non-empty. Empty runs grok with the
    # global flags the keys below set, then `--no-auto-update agent
    # --no-leader stdio`. Config-file only: an entry may contain a comma.
    args: []
    # true answers every permission request with its allow option instead of
    # asking the phone. Keep false so the phone approves.
    always_approve: false
    # A session's working directory when the phone names none. Empty = the
    # daemon user's home directory; a relative path is resolved against this
    # file's directory.
    default_cwd: ""
    # The model a session starts on, e.g. grok-4.6. Empty = grok's own default.
    model: ""
    # low | medium | high | xhigh, as the model advertises. Applied through
    # session/new `_meta.reasoningEffort` (MADR 0106). Empty = grok's default.
    reasoning_effort: ""
    # default | acceptEdits | auto | dontAsk | bypassPermissions | plan
    # (--permission-mode). Pinned, not inherited (MADR 0050 D3): empty lets
    # grok's own config decide, which the daemon cannot see. Process-wide:
    # changing it needs an engine restart.
    permission_mode: "default"
    # true disables subagent spawning (--no-subagents).
    no_subagents: false
    # true disables grok's web search and web fetch tools (--disable-web-search).
    disable_web_search: false
    # grok's own OS-level sandbox profile (--sandbox <PROFILE>), MADR 0050.
    # Built-ins: off, workspace, devbox, read-only, strict. Any other value is
    # a custom profile, resolved by grok from ~/.grok/sandbox.toml or
    # .grok/sandbox.toml. Empty = grok's own default. grok also honours
    # GROK_SANDBOX.
    sandbox: ""
    # How long a permission request waits for the phone, in seconds, before
    # grok is told it was cancelled. 0 = wait forever.
    permission_timeout_seconds: 120
    # true keeps one spare initialized grok ready, so a session skips the cold
    # start (MADR 0089 D5). The phone can turn it on and off too.
    prewarm: false
    # A notice on the phone when a running turn produces no output for this
    # many seconds. 0 = off.
    turn_stall_notice_seconds: 120
    # Hold streamed text this many milliseconds so it ships as one event, not
    # one per token (MADR 0057 H-1). 0 = one event per token; max 1000.
    stream_coalesce_ms: 80
    # Confine grok's fs read/write callbacks to these roots (plus the session
    # cwd). Empty = unrestricted. Defense-in-depth and audit only, not a
    # sandbox: the agent has same-user terminal access. Config-file only.
    fs_roots: []
    # Pin of the ACP authenticate method. Empty lets the daemon pick a
    # headless-safe method grok advertises (MADR 0085 D2). Never pin the
    # grok.com method: it opens a browser.
    auth_method_id: ""
    # MCP servers advertised to grok. Each is forwarded only when grok
    # advertises its transport (mcpCapabilities.http / .sse). Config-file
    # only. Example:
    #   mcp_servers:
    #     - name: docs
    #       transport: http          # http | sse
    #       url: https://mcp.example.com/sse
    #       headers:
    #         Authorization: "Bearer <token>"
    mcp_servers: []
  # OpenCode (opencode.ai) v2, driven over ACP: each session runs its own
  # `opencode acp`, and one shared control plane (`opencode serve --stdio`,
  # started on demand) serves the workspace, diagnostics, diff, undo and auth
  # (0214 MADR). Pick it per session from the phone's provider menu.
  # The 1.x keys pure, session_tree, stream_coalesce_ms and allow_remote_share,
  # and the old transport, are gone: an unknown key here fails the load (0208
  # MADR D6).
  opencode:
    # Register OpenCode. Harmless when the binary is absent: it lists as not ready.
    enabled: true
    # The opencode executable, 2.1.0 or later, by name on PATH or by path.
    bin: "opencode"
    # Replaces the built-in argv (`acp`) when non-empty. Config-file only: an
    # entry may contain a comma.
    args: []
    # true answers every permission request with its allow option instead of
    # asking the phone. Keep false so the phone approves.
    always_approve: false
    # A session's working directory when the phone names none. Empty = the
    # daemon user's home directory; a relative path is resolved against this
    # file's directory.
    default_cwd: ""
    # The model a session starts on, as provider/model, e.g.
    # opencode/deepseek-v4.1-flash-free or anthropic/claude-haiku-4-5.
    # Empty = OpenCode's own configured default.
    model: ""
    # How long a permission request waits for the phone, in seconds, before
    # OpenCode is told it was cancelled. 0 = wait forever.
    permission_timeout_seconds: 120
    # true keeps one spare `opencode acp` ready, so a session skips the cold
    # start (MADR 0089 D5), at the cost of holding it idle. The phone can turn
    # it on and off too.
    prewarm: false
    # A notice on the phone when a running turn produces no output for this
    # many seconds. 0 = off.
    turn_stall_notice_seconds: 120
    # Confine the agent's fs read/write callbacks to these roots (plus the
    # session cwd). Empty = unrestricted. Defense-in-depth and audit only, not
    # a sandbox: the agent has same-user terminal access. Config-file only.
    fs_roots: []
    # Pin of the ACP authenticate method. Leave it empty: the phone's sign-in
    # runs on the control plane, and OpenCode's one ACP method,
    # opencode-login, opens a terminal login.
    auth_method_id: ""
    # MCP servers advertised to each session. Each is forwarded only when
    # OpenCode advertises its transport (mcpCapabilities.http / .sse); the
    # control plane loads none of OpenCode's own (0230 MADR). Config-file
    # only; same shape as grok's mcp_servers.
    mcp_servers: []
    # OFF by default (MADR 0112 A9). true lets a paired phone run a command in
    # the session's working directory. RISK: OpenCode's shell endpoint
    # bypasses the model's tool-permission checks, so this is remote command
    # execution on THIS host. The phone confirms every command, but that is a
    # second line of defence, not the first.
    allow_remote_shell: false
  # Codex (OpenAI Codex CLI), driven through one shared `codex app-server`
  # engine (JSON-RPC); all sessions multiplex over it (MADR 0028). Pick it per
  # session from the phone's provider menu.
  codex:
    # Register Codex. Harmless when the binary is absent: it lists as not ready.
    enabled: true
    # The codex executable, by name on PATH or by path. The credential guard
    # also asks it where the sign-in lives (MADR 0134).
    bin: "codex"
    # true answers every permission request with its allow option instead of
    # asking the phone, for every session. A session mode from the phone is the
    # narrower lever.
    always_approve: false
    # A session's working directory when the phone names none. Empty = the
    # daemon user's home directory; a relative path is resolved against this
    # file's directory.
    default_cwd: ""
    # The model a session starts on, e.g. gpt-5.6-terra. Empty = Codex's own
    # default from ~/.codex/config.toml.
    model: ""
    # How long a permission request waits for the phone, in seconds, before
    # Codex is told it was cancelled. 0 = wait forever. Longer than the other
    # providers' 120, because Codex's sandboxed tools may run for minutes
    # (MADR 0028).
    permission_timeout_seconds: 900
    # true boots the shared engine at daemon start, so the first session skips
    # the ~500 ms cold start (MADR 0089 D5). The phone can turn it on and off too.
    prewarm: false
    # A notice on the phone when a running turn produces no output for this
    # many seconds. 0 = off; it left phones looking frozen during multi-minute
    # Codex tool runs after a WS blip (MADR 0072 D1).
    turn_stall_notice_seconds: 120
    # Hold streamed text this many milliseconds so it ships as one event, not
    # one per token (MADR 0024). 0 = one event per token; max 1000.
    stream_coalesce_ms: 80
    # untrusted | on-request | never. With sandbox_mode, the pair a session
    # starts in, when it matches one of the modes. Both empty = mcremote's
    # default mode (on-request + workspace-write); never alone is repaired to
    # the auto pair (never + workspace-write) (MADR 0047).
    approval_policy: ""
    # read-only | workspace-write | danger-full-access. See approval_policy:
    # set both to pin a custom pair.
    sandbox_mode: ""
    # Advertise the "full access" session mode: no approval prompts AND no
    # sandbox. Without it, "auto" still skips approvals, but Codex confines
    # edits to the workspace (Seatbelt on macOS, bwrap on Linux). Only for a
    # machine you are content to let an unattended agent modify anywhere
    # (MADR 0044 D5).
    allow_full_access: false
    # When the Linux userns/bwrap workspace-write probe fails (MADR 0048):
    # warn = a notice only; require_full_access = start in full access (needs
    # allow_full_access: true) or fail the create; refuse = fail the create.
    sandbox_broken_policy: warn
    # The engine's transport: stdio (default) | unix_ws | ws |
    # managed_daemon_proxy. unix_ws and managed_daemon_proxy are Unix-only; ws
    # is loopback-only. The phone never sees the endpoint or its credential.
    transport: stdio
    # ws only: an optional loopback host:port. Wildcard and non-loopback binds
    # are rejected.
    listen_address: ""
    # ws only: capability_token | signed_bearer. Empty = a generated capability
    # token. Bearer material is generated into the daemon's runtime directory,
    # never configured here.
    ws_auth_mode: ""
    # Replacement attempts after the engine dies unexpectedly. 0 disables
    # replacement; maximum 3.
    reconnect_attempts: 3
    # Remote execution servers this host will run turns on (MADR 0109 D36).
    # Host-owned: phones select a configured id and read status/info, and
    # never see exec_server_url. ws:// is loopback-only; wss:// otherwise.
    # Config-file only. Example:
    #   environments:
    #     - id: "builder"
    #       exec_server_url: "wss://builder.example.ts.net:8443"
    #       connect_timeout_ms: 5000        # 1..60000
    #       runtime_workspace_roots: ["/srv/work"]   # absolute, deduplicated
    environments: []
    # Unsandboxed standalone processes (MADR 0109 D37). Off by default, and
    # each spawn still takes a fresh per-command confirmation on the phone.
    standalone_processes_enabled: false
    # Environment variable NAMES a phone may set on a standalone spawn. Empty
    # allows none. Secret-looking names are rejected at load: upstream Codex
    # logs argv at debug level, so secrets do not belong on this path.
    standalone_process_env_allowlist: []
  # Kilo CLI (kilo.ai, npm @kilocode/cli): an OpenCode fork with its own
  # Gateway, agents and model aliases, driven through one shared `kilo serve`
  # engine (HTTP + SSE) (MADR 0075). Known-good CLI: kilo 7.4.22 (MADR 0088).
  kilo:
    # Register Kilo. Harmless when the binary is absent: it lists as not ready.
    enabled: true
    # The kilo executable, by name on PATH or by path.
    bin: "kilo"
    # true answers every permission request with its allow option instead of
    # asking the phone. Keep false so the phone approves.
    always_approve: false
    # A session's working directory when the phone names none. Empty = the
    # daemon user's home directory; a relative path is resolved against this
    # file's directory.
    default_cwd: ""
    # providerID/modelID, split on the FIRST slash, since model ids may
    # themselves contain slashes: e.g. kilo/kilo-auto/free,
    # openrouter/openrouter/free, kilo/~anthropic/claude-sonnet-4-5. Empty =
    # Kilo's own default, which depends on Gateway auth state (kilo-auto/free
    # logged out, kilo-auto/balanced with a Gateway session).
    model: ""
    # How long a permission request waits for the phone, in seconds, before
    # Kilo is told it was cancelled. 0 = wait forever.
    permission_timeout_seconds: 120
    # true boots the shared engine at daemon start, so the first session skips
    # the Bun-class cold start (MADR 0089 D5). The phone can turn it on and off
    # too.
    prewarm: false
    # A notice on the phone when a running turn produces no output for this
    # many seconds. 0 = off.
    turn_stall_notice_seconds: 120
    # Hold streamed text this many milliseconds so it ships as one event, not
    # one per token (MADR 0024). 0 = one event per token; max 1000.
    stream_coalesce_ms: 80
    # Session-tree demux stays OFF for kilo until child-event fixtures prove
    # it (MADR 0075 Q7): the routes exist but are unverified on this fork.
    session_tree: false
    # true runs kilo serve with --pure: no external third-party plugins.
    pure: false

headscale:
  control_url: "http://localhost:8080"

limits:
  max_ws_clients: 8
  max_live_sessions: 16
  # Rolling authenticated-WS read deadline (seconds). 0 → 120. Floor 15.
  # Advertised to v2 phones (MADR 0068). Covers brief Doze/mesh blips;
  # awake clients still app-ping every 10 s.
  ws_read_deadline_seconds: 120
  # v2 resume-token validity after issue (0 → 120).
  ws_resume_window_seconds: 120
  # Kernel TCP keepalive on accepted connections (MADR 0068). Zero-value
  # fields also resolve to these numbers; spelled out so the lever is
  # visible. disable: true turns probes off. 25+4×5 ≈ 45 s reaps a
  # silent peer inside the 120 s app deadline.
  tcp_keepalive:
    disable: false
    idle_seconds: 25
    interval_seconds: 5
    count: 4

# host:port the pair QR/URI tells the phone to dial. Empty = auto-detect
# (Tailscale IPv4, else loopback). A bare host inherits listen.port.
# Ignored in tls.mode: letsencrypt (the ACME domain is advertised).
# Env: MCREMOTE_PAIR_ADVERTISE_HOST (legacy alias MCREMOTE_PAIR_HOST).
pair:
  advertise_host: ""

# Optional outbound registration to mcrelay (MADR 0015). Empty url = disabled.
# Prefer MCREMOTE_RELAY_SECRET over storing the secret in this file.
relay:
  url: ""
  host_id: ""
  secret: ""
  insecure_skip_verify: false
  # Cap on one relayed WS frame across the tunnel bridge (0115 F6); 0 = 10 MiB.
  max_frame_bytes: 0

# Signed receipts for permission decisions (MADR 0077). Off by default —
# opt in per pattern, not globally. See docs/guides/receipts.md. Omitting this
# block from a previous setup-service seed hid the lever entirely;
# receipts still default off via config.Defaults(), but operators had
# to discover the keys from docs/guides/config.md or add them by hand.
receipts:
  enabled: false             # MCREMOTE_RECEIPTS_ENABLED
  allow_patterns: []         # MCREMOTE_RECEIPTS_ALLOW_PATTERNS (comma-separated)
    # - "*rm -rf*"
    # - "*push --force*"
    # - "*kubectl delete*"
  deny_patterns: []          # MCREMOTE_RECEIPTS_DENY_PATTERNS; wins over allow
    # - "*--dry-run*"
  handoffs: true             # MCREMOTE_RECEIPTS_HANDOFFS — sign a receipt for
                             # each device-to-device session handoff (MADR 0078).
                             # Only consulted when enabled: true.
