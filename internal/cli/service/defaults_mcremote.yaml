# mcremote default configuration (written by setup-service when missing).
# Location: $XDG_CONFIG_HOME/mcremote/config.yaml or ~/.config/mcremote/config.yaml
# Values match config.Defaults(). See docs/config.md.

listen:
  host: "127.0.0.1"        # use "tailscale" for mesh-only remote access
  port: 7531

tls:
  # empty = letsencrypt when domains+email set, else selfsigned
  mode: ""
  enabled: true
  cert_file: ""
  key_file: ""
  letsencrypt:
    domains: []
    email: ""
    directory_url: ""
    staging: false
    cache_dir: ""
    route53:
      hosted_zone_id: ""
      region: ""
      profile: ""
      max_retries: 0

log:
  level: info
  format: text

# Empty = XDG data home (~/.local/share/mcremote)
data_dir: ""

# Friendly host name shown on the phone's sessions screen (MADR 0102).
# Empty = the dialled address. Env: MCREMOTE_DISPLAY_NAME.
display_name: ""

auth:
  require_device_token: true
  require_client_key: true
  allowed_origins: []

providers:
  fake:
    enabled: false
  grok:
    enabled: true
    bin: "grok"
    args: []
    always_approve: false
    default_cwd: ""
    model: ""
    reasoning_effort: ""     # low | medium | high | xhigh (model-dependent)
    # Pinned, not inherited (MADR 0050 D3). Empty would undo that pin:
    # YAML "" overwrites Defaults() and grok resolves its own config.
    permission_mode: "default"
    allowed_tools: []
    disallowed_tools: []
    allow_rules: []
    deny_rules: []
    no_subagents: false
    disable_web_search: false
    # OS sandbox profile passed to grok (`--sandbox <value>`). Empty = omit
    # the flag and inherit grok's own default. See config.example.yaml.
    sandbox: ""
    permission_timeout_seconds: 120
    # Off: engine starts on first session. Turn on from the phone
    # (Settings → Providers) or set true here.
    prewarm: false
    turn_stall_notice_seconds: 120
    stream_coalesce_ms: 80
    fs_roots: []
    auth_method_id: ""
    mcp_servers: []
  goose:
    enabled: true
    bin: "goose"
    always_approve: false
    default_cwd: ""
    model: ""
    permission_timeout_seconds: 120
    prewarm: false
    turn_stall_notice_seconds: 120
    stream_coalesce_ms: 80
    auth_method_id: ""
    keyring_disabled: true
    with_builtins: []
    mcp_servers: []
  opencode:
    enabled: true
    bin: "opencode"
    always_approve: false
    default_cwd: ""
    model: ""
    permission_timeout_seconds: 120
    # Off: engine starts on first session. Turn on from the phone
    # (Settings → Providers) or set true here.
    prewarm: false
    turn_stall_notice_seconds: 120
    stream_coalesce_ms: 80
    session_tree: true       # MADR 0020 KD11 (requires opencode ≥ 1.18.0)
    pure: false
  codex:
    enabled: true
    bin: "codex"
    always_approve: false
    default_cwd: ""
    model: ""
    permission_timeout_seconds: 900
    prewarm: false
    turn_stall_notice_seconds: 120
    stream_coalesce_ms: 80
    approval_policy: ""
    sandbox_mode: ""
    # Advertise the "full access" session mode: no approval prompts AND no
    # sandbox (MADR 0044). Off, "auto" still bypasses approvals but codex
    # confines edits to the workspace (Seatbelt on macOS, bwrap on Linux —
    # where bwrap fails under AppArmor, 0048, full access is the only
    # writable mode). Omitting this key from provisioned configs was the
    # macOS/Linux menu asymmetry of MADR 0069 F1 — keep it explicit here.
    allow_full_access: false
    # When the Linux userns/bwrap workspace-write probe fails (MADR 0048):
    # warn (default) | require_full_access | refuse. Keep this key explicit
    # so provisioned hosts see the lever (0071 F2 / 0069 F1).
    sandbox_broken_policy: warn
  # Kilo CLI (kilo.ai) — shared `kilo serve` engine, OpenCode-fork dialect
  # (MADR 0075). Known-good CLI: kilo 7.4.22 (MADR 0088).
  kilo:
    enabled: true
    bin: "kilo"
    always_approve: false
    default_cwd: ""
    # Empty = Kilo's own default (Gateway-auth-state-dependent). Pin
    # providerID/modelID split on the FIRST slash (ids may contain slashes).
    model: ""
    permission_timeout_seconds: 120
    # Off: engine starts on first session. Turn on from the phone
    # (Settings → Providers) or set true here.
    prewarm: false
    turn_stall_notice_seconds: 120
    stream_coalesce_ms: 80
    # Off until child-session SSE fixtures prove tree demux (MADR 0075 Q7).
    session_tree: false
    pure: false

headscale:
  control_url: "http://localhost:8080"

limits:
  max_ws_clients: 8
  max_live_sessions: 16
  # Rolling authenticated-WS read deadline (seconds). 0 → 120. Floor 15.
  # Advertised to v2 phones (MADR 0068). Covers brief Doze/mesh blips;
  # awake clients still app-ping every 10 s.
  ws_read_deadline_seconds: 120
  # v2 resume-token validity after issue (0 → 120).
  ws_resume_window_seconds: 120
  # Kernel TCP keepalive on accepted connections (MADR 0068). Zero-value
  # fields also resolve to these numbers; spelled out so the lever is
  # visible. disable: true turns probes off. 25+4×5 ≈ 45 s reaps a
  # silent peer inside the 120 s app deadline.
  tcp_keepalive:
    disable: false
    idle_seconds: 25
    interval_seconds: 5
    count: 4

# host:port the pair QR/URI tells the phone to dial. Empty = auto-detect
# (Tailscale IPv4, else loopback). A bare host inherits listen.port.
# Ignored in tls.mode: letsencrypt (the ACME domain is advertised).
# Env: MCREMOTE_PAIR_ADVERTISE_HOST (legacy alias MCREMOTE_PAIR_HOST).
pair:
  advertise_host: ""

# Optional outbound registration to mcrelay (MADR 0015). Empty url = disabled.
# Prefer MCREMOTE_RELAY_SECRET over storing the secret in this file.
relay:
  url: ""
  host_id: ""
  secret: ""
  insecure_skip_verify: false

# Signed receipts for permission decisions (MADR 0077). Off by default —
# opt in per pattern, not globally. See docs/receipts.md. Omitting this
# block from a previous setup-service seed hid the lever entirely;
# receipts still default off via config.Defaults(), but operators had
# to discover the keys from docs/config.md or add them by hand.
receipts:
  enabled: false             # MCREMOTE_RECEIPTS_ENABLED
  allow_patterns: []         # MCREMOTE_RECEIPTS_ALLOW_PATTERNS (comma-separated)
    # - "*rm -rf*"
    # - "*push --force*"
    # - "*kubectl delete*"
  deny_patterns: []          # MCREMOTE_RECEIPTS_DENY_PATTERNS; wins over allow
    # - "*--dry-run*"
  handoffs: true             # MCREMOTE_RECEIPTS_HANDOFFS — sign a receipt for
                             # each device-to-device session handoff (MADR 0078).
                             # Only consulted when enabled: true.
